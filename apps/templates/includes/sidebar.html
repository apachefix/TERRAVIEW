{% load permission_filters %}
    <!-- [ navigation menu ] start -->
	<nav class="pcoded-navbar menupos-fixed navbar-dark ">
		<div class="navbar-wrapper  ">
			<div class="navbar-content scroll-div " >
				<!-- The Inner links -->
				{% include 'includes/component-navbar-inner.html' %}
			</div>
		</div>
	</nav>
    <style>
        .pcoded-navbar .navbar-content,
        .pcoded-navbar .scroll-div.navbar-content {
            overflow-x: hidden !important;
            overflow-y: auto !important;
        }

        .pcoded-navbar .sidebar-search-caption {
            margin-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .pcoded-navbar .sidebar-search-section {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            padding: 0 12px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        .pcoded-navbar .sidebar-search-card {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .pcoded-navbar .sidebar-search-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 4px;
            color: #fff;
            font-size: 13px;
            font-weight: 800;
            line-height: 1.3;
        }

        .pcoded-navbar .sidebar-search-title i {
            color: var(--color-light, #e8e3c8);
        }

        .pcoded-navbar .sidebar-search-help {
            margin: 0 0 10px;
            color: rgba(255, 255, 255, 0.68);
            font-size: 11px;
            line-height: 1.35;
        }

        .pcoded-navbar .sidebar-search-form {
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
        }

        .pcoded-navbar .sidebar-search-input {
            width: 100%;
            max-width: 100%;
            height: 40px;
            box-sizing: border-box;
            padding: 0 10px;
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 7px;
            background: #fff;
            color: #1e293b;
            font-size: 12px;
            line-height: 40px;
            outline: none;
        }

        .pcoded-navbar .sidebar-search-input:focus {
            border-color: var(--color-accent, #d36b5c);
            box-shadow: 0 0 0 3px rgba(211, 107, 92, 0.18);
        }

        .pcoded-navbar .sidebar-search-button {
            width: 100%;
            max-width: 100%;
            min-height: 40px;
            box-sizing: border-box;
            margin: 0;
            padding: 8px 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 7px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            background: var(--color-primary-700, #164f7a);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            line-height: 1.2;
            cursor: pointer;
            transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease, transform 100ms ease;
        }

        .pcoded-navbar .sidebar-search-button:hover,
        .pcoded-navbar .sidebar-search-button:focus {
            border-color: rgba(255, 255, 255, 0.26);
            background: var(--color-accent, #d36b5c);
            color: #fff;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
            outline: none;
        }

        .pcoded-navbar .sidebar-search-button:active {
            transform: translateY(1px);
            box-shadow: 0 3px 9px rgba(0, 0, 0, 0.16);
        }

        .pcoded-navbar .sidebar-search-button:disabled {
            cursor: not-allowed;
            opacity: 0.56;
            box-shadow: none;
        }

        .pcoded-navbar.navbar-collapsed .sidebar-search-caption,
        .pcoded-navbar.navbar-collapsed .sidebar-search-section {
            display: none !important;
        }

        @media only screen and (max-width: 991px) {
            .pcoded-navbar .sidebar-search-section {
                padding-bottom: 22px;
            }
        }
    </style>
    <!-- [ navigation menu ] end -->
