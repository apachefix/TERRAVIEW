<style id="terraview-loader-critical">
	:root {
		--terraview-loader-primary: #0B2545;
		--terraview-loader-primary-dark: #07182d;
		--terraview-loader-accent: #D36B5C;
		--terraview-loader-support: #6C8784;
		--terraview-loader-light: #E8E3C8;
	}

	#terraViewGlobalLoader.terraview-loader {
		position: fixed !important;
		inset: 0 !important;
		z-index: 2147483000 !important;
		display: grid !important;
		place-items: center !important;
		width: 100vw !important;
		height: 100vh !important;
		min-height: 100vh !important;
		overflow: hidden !important;
		background:
			linear-gradient(90deg, rgba(232, 227, 200, 0.045) 1px, transparent 1px),
			linear-gradient(180deg, rgba(232, 227, 200, 0.035) 1px, transparent 1px),
			radial-gradient(circle at 50% 50%, rgba(108, 135, 132, 0.28) 0%, rgba(11, 37, 69, 0) 42%),
			linear-gradient(145deg, var(--terraview-loader-primary-dark) 0%, var(--terraview-loader-primary) 58%, #102f57 100%) !important;
		background-size: 44px 44px, 44px 44px, 100% 100%, 100% 100% !important;
		color: #fff !important;
		opacity: 1 !important;
		visibility: visible !important;
		pointer-events: auto !important;
		transition: opacity 520ms ease, visibility 520ms ease !important;
		animation: terraViewLoaderAutoExit 3600ms ease forwards !important;
	}

	#terraViewGlobalLoader.terraview-loader.is-hiding,
	#terraViewGlobalLoader.terraview-loader.is-hidden {
		opacity: 0 !important;
		visibility: hidden !important;
		pointer-events: none !important;
	}

	#terraViewGlobalLoader .terraview-loader__scan {
		position: absolute !important;
		inset: -40% !important;
		background: linear-gradient(115deg, transparent 42%, rgba(232, 227, 200, 0.10) 50%, transparent 58%) !important;
		transform: translateX(-32%) rotate(0.001deg);
		animation: terraViewLoaderScan 2.4s ease-in-out infinite !important;
		pointer-events: none !important;
	}

	#terraViewGlobalLoader .terraview-loader__halo {
		position: absolute !important;
		width: clamp(260px, 44vw, 560px) !important;
		aspect-ratio: 1 !important;
		border-radius: 50% !important;
		border: 1px solid rgba(232, 227, 200, 0.10) !important;
		box-shadow: inset 0 0 54px rgba(108, 135, 132, 0.12), 0 0 80px rgba(211, 107, 92, 0.10) !important;
		animation: terraViewLoaderHalo 3.2s ease-in-out infinite !important;
		pointer-events: none !important;
	}

	#terraViewGlobalLoader .terraview-loader__halo::before,
	#terraViewGlobalLoader .terraview-loader__halo::after {
		content: "" !important;
		position: absolute !important;
		inset: 10% !important;
		border-radius: 50% !important;
		border: 1px solid transparent !important;
		border-top-color: rgba(211, 107, 92, 0.48) !important;
		border-right-color: rgba(108, 135, 132, 0.32) !important;
		animation: terraViewLoaderOrbit 2.8s linear infinite !important;
	}

	#terraViewGlobalLoader .terraview-loader__halo::after {
		inset: 20% !important;
		border-top-color: rgba(232, 227, 200, 0.30) !important;
		border-right-color: transparent !important;
		animation-duration: 3.8s !important;
		animation-direction: reverse !important;
	}

	#terraViewGlobalLoader .terraview-loader__content {
		position: relative !important;
		z-index: 2 !important;
		display: flex !important;
		flex-direction: column !important;
		align-items: center !important;
		justify-content: center !important;
		gap: clamp(18px, 2.6vw, 30px) !important;
		width: min(92vw, 760px) !important;
		text-align: center !important;
	}

	#terraViewGlobalLoader .terraview-loader__brand {
		display: flex !important;
		align-items: baseline !important;
		justify-content: center !important;
		gap: 0 !important;
		font-family: "Poppins", "Segoe UI", Arial, sans-serif !important;
		font-size: clamp(44px, 9vw, 104px) !important;
		font-weight: 800 !important;
		line-height: 0.9 !important;
		letter-spacing: 0.08em !important;
		text-transform: uppercase !important;
	}

	#terraViewGlobalLoader .terraview-loader__word {
		display: inline-block !important;
		color: rgba(255, 255, 255, 0.95) !important;
		text-shadow: 0 0 26px rgba(232, 227, 200, 0.18) !important;
		animation: terraViewLoaderWordIn 620ms cubic-bezier(0.2, 0.8, 0.2, 1) both !important;
	}

	#terraViewGlobalLoader .terraview-loader__control {
		display: inline-block !important;
		margin-left: -0.08em !important;
		color: var(--terraview-loader-accent) !important;
		transform-origin: center !important;
		text-shadow:
			0 0 14px rgba(211, 107, 92, 0.72),
			0 0 34px rgba(211, 107, 92, 0.42),
			0 0 72px rgba(211, 107, 92, 0.20) !important;
		animation:
			terraViewLoaderControlIn 720ms 520ms cubic-bezier(0.16, 1, 0.3, 1) both,
			terraViewLoaderControlPulse 1.7s 1.25s ease-in-out infinite !important;
	}

	#terraViewGlobalLoader .terraview-loader__tagline {
		position: relative !important;
		display: inline-flex !important;
		align-items: center !important;
		justify-content: center !important;
		min-width: min(86vw, 360px) !important;
		padding: 10px 18px !important;
		border: 1px solid rgba(232, 227, 200, 0.18) !important;
		border-radius: 999px !important;
		background: rgba(7, 24, 45, 0.42) !important;
		color: rgba(232, 227, 200, 0.92) !important;
		font-family: "Poppins", "Segoe UI", Arial, sans-serif !important;
		font-size: clamp(15px, 2.2vw, 22px) !important;
		font-weight: 700 !important;
		line-height: 1.25 !important;
		letter-spacing: 0.06em !important;
		white-space: nowrap !important;
		text-transform: none !important;
		box-shadow: 0 10px 34px rgba(0, 0, 0, 0.16), inset 0 0 20px rgba(108, 135, 132, 0.12) !important;
		opacity: 0;
		transform: translateY(16px) scale(0.96);
		animation:
			terraViewLoaderTaglineIn 520ms 1.18s cubic-bezier(0.16, 1, 0.3, 1) forwards,
			terraViewLoaderTaglineGlow 1.8s 1.75s ease-in-out infinite !important;
	}

	#terraViewGlobalLoader .terraview-loader__tagline::before {
		content: "" !important;
		position: absolute !important;
		inset: -1px !important;
		border-radius: inherit !important;
		border: 1px solid rgba(211, 107, 92, 0.30) !important;
		box-shadow: 0 0 22px rgba(211, 107, 92, 0.16) !important;
		pointer-events: none !important;
	}

	#terraViewGlobalLoader .terraview-loader__line {
		width: min(52vw, 360px) !important;
		height: 1px !important;
		background: linear-gradient(90deg, transparent, rgba(232, 227, 200, 0.30), rgba(211, 107, 92, 0.75), rgba(232, 227, 200, 0.30), transparent) !important;
		transform: scaleX(0) !important;
		transform-origin: center !important;
		animation: terraViewLoaderLine 780ms 1.35s ease-out forwards !important;
	}

	@keyframes terraViewLoaderWordIn {
		from {
			opacity: 0;
			transform: translateY(18px);
			filter: blur(8px);
		}

		to {
			opacity: 1;
			transform: translateY(0);
			filter: blur(0);
		}
	}

	@keyframes terraViewLoaderControlIn {
		0% {
			opacity: 0;
			transform: translateX(42px) rotate(-18deg) scale(0.82);
			filter: blur(10px);
		}

		62% {
			opacity: 1;
			transform: translateX(0) rotate(5deg) scale(1.12);
			filter: blur(0);
		}

		100% {
			opacity: 1;
			transform: translateX(0) rotate(0deg) scale(1);
			filter: blur(0);
		}
	}

	@keyframes terraViewLoaderControlPulse {
		0%, 100% {
			text-shadow: 0 0 14px rgba(211, 107, 92, 0.72), 0 0 34px rgba(211, 107, 92, 0.42), 0 0 72px rgba(211, 107, 92, 0.20);
		}

		50% {
			text-shadow: 0 0 22px rgba(211, 107, 92, 0.95), 0 0 52px rgba(211, 107, 92, 0.62), 0 0 92px rgba(211, 107, 92, 0.30);
		}
	}

	@keyframes terraViewLoaderTaglineIn {
		from {
			opacity: 0;
			transform: translateY(16px) scale(0.96);
		}

		to {
			opacity: 1;
			transform: translateY(0) scale(1);
		}
	}

	@keyframes terraViewLoaderTaglineGlow {
		0%, 100% {
			box-shadow: 0 10px 34px rgba(0, 0, 0, 0.16), inset 0 0 20px rgba(108, 135, 132, 0.12);
		}

		50% {
			box-shadow: 0 10px 38px rgba(0, 0, 0, 0.20), 0 0 28px rgba(211, 107, 92, 0.12), inset 0 0 24px rgba(108, 135, 132, 0.16);
		}
	}

	@keyframes terraViewLoaderLine {
		to {
			transform: scaleX(1);
		}
	}

	@keyframes terraViewLoaderScan {
		0%, 100% {
			transform: translateX(-34%);
			opacity: 0;
		}

		45%, 60% {
			opacity: 1;
		}

		100% {
			transform: translateX(34%);
		}
	}

	@keyframes terraViewLoaderHalo {
		0%, 100% {
			transform: scale(0.98);
			opacity: 0.74;
		}

		50% {
			transform: scale(1.04);
			opacity: 1;
		}
	}

	@keyframes terraViewLoaderOrbit {
		to {
			transform: rotate(360deg);
		}
	}

	@keyframes terraViewLoaderAutoExit {
		0%, 82% {
			opacity: 1;
			visibility: visible;
			pointer-events: auto;
		}

		100% {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}
	}

	@media (max-width: 575.98px) {
		#terraViewGlobalLoader .terraview-loader__brand {
			gap: 0 !important;
			letter-spacing: 0.045em !important;
		}

		#terraViewGlobalLoader .terraview-loader__tagline {
			font-size: 15px !important;
		}
	}

	@media (prefers-reduced-motion: reduce) {
		#terraViewGlobalLoader *,
		#terraViewGlobalLoader *::before,
		#terraViewGlobalLoader *::after {
			animation-duration: 1ms !important;
			animation-iteration-count: 1 !important;
			transition-duration: 1ms !important;
		}
	}
</style>
<!-- [ TERRAVIEW global loader ] start -->
<div id="terraViewGlobalLoader" class="terraview-loader" role="status" aria-live="polite" aria-label="Cargando TERRAVIEW">
	<div class="terraview-loader__scan" aria-hidden="true"></div>
	<div class="terraview-loader__halo" aria-hidden="true"></div>
	<div class="terraview-loader__content" aria-hidden="true">
		<div class="terraview-loader__brand">
			<span class="terraview-loader__word">TERRA</span>
			<span class="terraview-loader__control">VIEW</span>
		</div>
		<div class="terraview-loader__tagline">Plataforma logística</div>
		<div class="terraview-loader__line"></div>
	</div>
</div>
<script>
	(function() {
		var loader = document.getElementById('terraViewGlobalLoader');
		if (!loader) {
			return;
		}

		function forceHideTERRAVIEWLoader() {
			loader.classList.add('is-hidden');
			loader.setAttribute('aria-hidden', 'true');
			loader.style.opacity = '0';
			loader.style.visibility = 'hidden';
			loader.style.pointerEvents = 'none';
			loader.style.display = 'none';
		}

		window.setTimeout(forceHideTERRAVIEWLoader, 3600);
		window.setTimeout(forceHideTERRAVIEWLoader, 5200);
		window.addEventListener('load', function() {
			window.setTimeout(forceHideTERRAVIEWLoader, 2600);
		});
	})();
</script>
<!-- [ TERRAVIEW global loader ] End -->
