<script>
(function () {
    const PATIO_EMPRESA_ID = "{{ empresa_activa_id|default:'' }}";
    const PATIO_PLANIFICACIONES_URL = "{% url 'pla_listall' %}";
    let patioCamionActual = null;
    let patioCitacionSeleccionada = null;
    let patioDetalleActual = null;

    function patioEscape(value) {
        return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function patioCookie(name) {
        const cookies = document.cookie ? document.cookie.split(';') : [];
        for (const item of cookies) {
            const cookie = item.trim();
            if (cookie.startsWith(name + '=')) return decodeURIComponent(cookie.slice(name.length + 1));
        }
        return '';
    }

    function patioNormalizarTipoCitacion(value) {
        return String(value || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toUpperCase()
            .trim();
    }

    function patioAlert(message, type) {
        $('#patioModalAlert')
            .removeClass('alert-info alert-warning alert-danger alert-success')
            .addClass('alert-' + (type || 'info'))
            .show()
            .text(message || '');
    }

    function patioAplicarFiltroCitaciones(tipo) {
        const filtro = patioNormalizarTipoCitacion(tipo);
        let visibles = 0;
        $('.patio-citation-filter-btn')
            .removeClass('active btn-secondary')
            .addClass('btn-outline-secondary');
        $('.patio-citation-filter-btn').filter(function () {
            return patioNormalizarTipoCitacion($(this).data('tipo-citacion-filtro')) === filtro;
        }).addClass('active btn-secondary').removeClass('btn-outline-secondary');
        $('#patioCitacionesList .citacion-sugerida-card').each(function () {
            const card = $(this);
            const tipoCard = patioNormalizarTipoCitacion(card.data('tipo-citacion'));
            const mostrar = !filtro || tipoCard === filtro;
            card.toggle(mostrar);
            if (mostrar) visibles += 1;
        });
        $('#patioCitacionesFiltroEmpty').toggle(!!filtro && visibles === 0);
    }

    function patioPrepararFiltrosCitaciones(hayCitaciones) {
        $('.patio-citation-filter').toggle(!!hayCitaciones);
        $('#patioCitacionesFiltroEmpty').hide();
        patioAplicarFiltroCitaciones('');
    }

    function patioField(name, label, value, required, wrapperClass) {
        return '<div class="form-group mb-0 ' + patioEscape(wrapperClass || '') + '">' +
            '<label>' + patioEscape(label) + (required ? ' *' : '') + '</label>' +
            '<input type="text" class="form-control" name="' + patioEscape(name) + '" value="' + patioEscape(value || '') + '"' + (required ? ' required' : '') + '>' +
            '</div>';
    }

    function patioRutValido(valor) {
        const limpio = String(valor || '').trim().toUpperCase().replace(/[.\s-]/g, '');
        if (!/^\d{7,8}[0-9K]$/.test(limpio)) return false;
        const cuerpo = limpio.slice(0, -1);
        const dvInformado = limpio.slice(-1);
        let suma = 0;
        let factor = 2;
        for (let indice = cuerpo.length - 1; indice >= 0; indice -= 1) {
            suma += Number(cuerpo.charAt(indice)) * factor;
            factor = factor === 7 ? 2 : factor + 1;
        }
        const resultado = 11 - (suma % 11);
        const dvEsperado = resultado === 11 ? '0' : (resultado === 10 ? 'K' : String(resultado));
        return dvInformado === dvEsperado;
    }

    function patioRutField(value) {
        return '<div class="form-group mb-0">' +
            '<label>RUT conductor *</label>' +
            '<input type="text" class="form-control" name="rut_conductor" value="' + patioEscape(value || '') + '" required>' +
            '<div class="invalid-feedback">RUT inválido. Revise número y dígito verificador.</div>' +
            '</div>';
    }

    function patioValidarRutEdicion() {
        const input = $('#patioEditForm [name="rut_conductor"]');
        if (!input.length) return true;
        const valido = patioRutValido(input.val());
        input.toggleClass('is-invalid', !valido);
        return valido;
    }

    function patioTipoRecepcionField(camion) {
        return '<div class="form-group mb-0">' +
            '<label>Tipo de recepci\u00f3n *</label>' +
            '<select class="form-control" id="patioEditTipoRecepcion" name="tipo_recepcion" required>' +
            '<option value="">Seleccione...</option>' +
            '<option value="NACIONAL"' + (camion.tipo_recepcion === 'NACIONAL' ? ' selected' : '') + '>Nacional</option>' +
            '<option value="IMPORTACION"' + (camion.tipo_recepcion === 'IMPORTACION' ? ' selected' : '') + '>Importación</option>' +
            (camion.tipo_recepcion === 'EXTRANJERO' ? '<option value="EXTRANJERO" selected>Extranjero</option>' : '') +
            '</select></div>';
    }

    function patioTransporteCargoField(camion) {
        return '<div class="form-group mb-0"><label>Transporte a cargo de *</label>' +
            '<select class="form-control" name="transporte_a_cargo" required>' +
            '<option value="">Seleccione...</option>' +
            '<option value="TERRAMAR"' + (camion.transporte_a_cargo === 'TERRAMAR' ? ' selected' : '') + '>Terramar</option>' +
            '<option value="CLIENTE"' + (camion.transporte_a_cargo === 'CLIENTE' ? ' selected' : '') + '>Cliente</option>' +
            '</select></div>';
    }

    function patioActualizarCamposRecepcionEdicion(limpiar) {
        const select = $('#patioEditTipoRecepcion');
        if (!select.length) return;
        const esImportacion = ['IMPORTACION', 'EXTRANJERO'].includes(select.val());
        $('.patio-edit-extranjero').toggle(esImportacion).find(':input').prop('disabled', !esImportacion);
        if (limpiar && !esImportacion) $('.patio-edit-extranjero :input').val('');
    }

    function patioRenderFormEdicion(camion) {
        let camposRecepcion = '';
        if (camion.es_recepcion_sbh) {
            camposRecepcion =
                patioTipoRecepcionField(camion) +
                patioField('bl', 'BL', camion.bl, false, 'patio-edit-extranjero') +
                patioField('lote_contenedor', 'Contenedor', camion.lote_contenedor, false, 'patio-edit-extranjero') +
                patioField('fecha_produccion', 'Fecha producci\u00f3n', camion.fecha_produccion_display || camion.fecha_produccion, false) +
                patioField('fecha_vencimiento', 'Fecha vencimiento (DD/MM/AAAA)', camion.fecha_vencimiento_display || camion.fecha_vencimiento, false) +
                patioField('cda', 'CDA', camion.cda, false, 'patio-edit-extranjero') +
                patioField('di', 'DI', camion.di, false, 'patio-edit-extranjero') +
                patioField('nave_naviera', 'Nave / Naviera', camion.nave_naviera, false, 'patio-edit-extranjero') +
                patioField('sui', 'SUI', camion.sui, false, 'patio-edit-extranjero');
        } else {
            camposRecepcion =
                patioField('bl', 'BL', camion.bl, false) +
                patioField('lote_contenedor', 'Lote/contenedor', camion.lote_contenedor, false);
        }
return '<form id="patioEditForm">' +
            '<input type="hidden" name="conductor_id" value="' + patioEscape(camion.conductor_id || '') + '">' +
            '<div class="patio-edit-form-grid">' +
            patioTransporteCargoField(camion) +
            patioField('transportista', 'Empresa transporte', camion.transportista, true) +
            patioField('conductor', 'Nombre conductor', camion.conductor, true) +
            patioRutField(camion.rut_conductor) +
            patioField('telefono_conductor', 'Celular conductor', camion.telefono, true) +
            patioField('telefono_codigo_pais', 'Codigo pais', camion.telefono_codigo_pais, true) +
            patioField('patente', 'Patente camion', camion.patente, true) +
            patioField('proveedor', 'Proveedor declarado', camion.proveedor, !camion.es_despacho_sbh) +
            patioField('cliente', 'Cliente declarado', camion.cliente, !camion.es_despacho_sbh) +
            patioField('numero_guia', 'Numero guia/documento', camion.guia, !camion.es_despacho_sbh) +
            patioField('insumo_declarado_guia', 'Insumo declarado en guia', camion.insumo_declarado_guia, !camion.es_despacho_sbh) +
            camposRecepcion +
            '</div>' +
            '<div class="form-group mt-3 mb-0">' +
            '<label>Observacion</label>' +
            '<textarea class="form-control" name="observacion" rows="3">' + patioEscape(camion.observacion || '') + '</textarea>' +
            '</div>' +
            '<div class="text-right mt-3">' +
            '<button type="button" class="btn btn-outline-secondary mr-2" id="btnCancelarEdicionPatio">Cancelar</button>' +
            '<button type="submit" class="btn btn-primary">Guardar datos</button>' +
            '</div>' +
            '</form>';
    }

    function patioDocumentoRow(tipo, label, adjunto, permisos) {
        const puedeGestionar = !!(permisos && permisos.puede_gestionar_adjuntos);
        const existe = !!adjunto;
        const nombre = existe ? (adjunto.nombre || '-') : 'Sin archivo';
        const meta = existe
            ? '<div class="patio-muted">' + patioEscape(adjunto.fecha_carga || '-') + (adjunto.usuario ? ' | ' + patioEscape(adjunto.usuario) : '') + '</div>'
            : '<div class="patio-muted">Pendiente de carga</div>';
        const ver = existe && adjunto.url && adjunto.disponible
            ? '<a class="btn btn-sm btn-outline-secondary" href="' + patioEscape(adjunto.url) + '" target="_blank" rel="noopener">Ver</a>'
            : '';
        const subir = puedeGestionar
            ? '<label class="btn btn-sm btn-outline-primary mb-0">' + (existe ? 'Reemplazar' : 'Subir') +
                '<input type="file" class="d-none patio-doc-input" data-tipo="' + patioEscape(tipo) + '" data-adjunto-id="' + patioEscape(existe ? adjunto.id : '') + '">' +
                '</label>'
            : '';
        const eliminar = puedeGestionar && existe && adjunto.puede_eliminar
            ? '<button type="button" class="btn btn-sm btn-outline-danger patio-doc-delete" data-adjunto-id="' + patioEscape(adjunto.id) + '">Eliminar</button>'
            : '';
        return '<div class="patio-document-row">' +
            '<div><strong>' + patioEscape(label) + '</strong></div>' +
            '<div>' + patioEscape(nombre) + meta + '</div>' +
            '<div class="d-flex flex-wrap justify-content-end" style="gap:6px;">' + ver + subir + eliminar + '</div>' +
            '</div>';
    }

    function patioRenderDocumentos(data) {
        const permisos = data.permisos || {};
        const tipos = data.tipos_documento || [];
        const adjuntos = data.adjuntos || [];
        const usados = {};
        let html = '';
        tipos.forEach(function (tipo) {
            const adjunto = adjuntos.find(function (item) {
                return item.tipo === tipo.value && !usados[item.id];
            });
            if (adjunto) usados[adjunto.id] = true;
            html += patioDocumentoRow(tipo.value, tipo.label, adjunto, permisos);
        });
        adjuntos.forEach(function (adjunto) {
            if (!usados[adjunto.id]) {
                html += patioDocumentoRow(adjunto.tipo, adjunto.tipo_label || adjunto.tipo, adjunto, permisos);
            }
        });
        return html || '<div class="text-muted">Sin adjuntos</div>';
    }

    function patioRenderNoPlanificado(camion, permisos) {
        const existe = !!camion.existe_solicitud_no_planificado;
        const puedeSolicitar = !!(permisos && permisos.puede_solicitar_no_planificado);
        const estadosClase = {
            PENDIENTE: 'badge-warning',
            APROBADO_PENDIENTE_PLANIFICACION: 'badge-info',
            APROBADO: 'badge-success',
            RECHAZADO: 'badge-danger'
        };
        $('#patioNoPlanificadoEstado')
            .removeClass('badge-warning badge-info badge-success badge-danger')
            .addClass(estadosClase[camion.solicitud_estado] || 'badge-secondary')
            .text(camion.solicitud_estado_label || camion.solicitud_estado || '')
            .toggle(existe);
        $('#btnNoPlanificadoPatio')
            .toggle(puedeSolicitar && !existe)
            .prop('disabled', existe);
        $('#btnReintentarTeamsPatio').toggle(
            existe && puedeSolicitar && !camion.teams_enviado && camion.teams_estado !== 'ENVIANDO'
        );
    }

    function renderPatioDetalle(data) {
        const camion = data.camion || {};
        const permisos = data.permisos || {};
        const validacionAsociacion = data.validacion_asociacion || {};
        const camposInvalidos = validacionAsociacion.campos || [];
        const datosBloqueanAsociacion = !!validacionAsociacion.aplica && !validacionAsociacion.valido;
        patioDetalleActual = data;
        patioCamionActual = camion;
        patioCitacionSeleccionada = null;
        const solicitudBloqueaAsociacion = ['PENDIENTE', 'APROBADO_PENDIENTE_PLANIFICACION'].includes(camion.solicitud_estado);
        const citacionAprobadaId = camion.solicitud_citacion_id || null;
        $('#btnAsociarCamionPatio')
            .toggle(!!permisos.puede_asociar)
            .prop('disabled', !permisos.puede_asociar || camion.estado === 'ASOCIADO_CITACION' || solicitudBloqueaAsociacion || permisos.asociacion_directa_asistente_despacho || datosBloqueanAsociacion)
            .text(permisos.asociacion_directa_asistente_despacho ? 'Seleccione una citacion' : 'Buscar citacion');
        patioRenderNoPlanificado(camion, permisos);
        $('#patioCitacionAprobada').toggle(!!citacionAprobadaId);
        $('#patioCitacionAprobadaNumero').text(citacionAprobadaId ? '#' + citacionAprobadaId : '');
        $('#btnIrCitacionAprobada')
            .attr('href', camion.solicitud_citacion_url || '#')
            .toggle(!!citacionAprobadaId && !!camion.solicitud_citacion_url);
        $('#btnEditarCamionPatio').toggle(!!permisos.puede_editar);
        $('#patioModalSubtitle').text('Patente ' + (camion.patente || ''));
        if (permisos.mensaje_bloqueo) {
            patioAlert(permisos.mensaje_bloqueo, 'warning');
        } else {
            $('#patioModalAlert').hide().text('');
        }
        const validacionHtml = datosBloqueanAsociacion
            ? '<div class="alert alert-warning mb-3"><strong>Datos obligatorios incompletos.</strong>' +
              '<ul class="mb-1 mt-2">' + (validacionAsociacion.errores || []).map(function (error) {
                  return '<li>' + patioEscape(error) + '</li>';
              }).join('') + '</ul>Use <strong>Editar datos</strong> para completar conductor y transportista antes de asociar.</div>'
            : '';
        const fields = [
            ['Estado', camion.estado_visible || camion.estado], ['Patente', camion.patente],
            ['Conductor', camion.conductor, 'conductor'], ['RUT', camion.rut_conductor, 'rut_conductor'],
            ['Código país', camion.telefono_codigo_pais, 'telefono_codigo_pais'],
            ['Teléfono', camion.telefono, 'telefono_conductor'],
            ['Transportista', camion.transportista, 'transportista'], ['Proveedor declarado', camion.proveedor],
            ['Insumo declarado en guia', camion.insumo_declarado_guia],
            ['Cliente declarado', camion.cliente], ['Guia/documento', camion.guia]
        ];
        if (camion.es_despacho_sbh) {
            fields.push(
                ['Origen ingreso', camion.origen_ingreso],
                ['Citacion candidata', camion.citacion_candidata_id],
                ['Planificacion candidata', camion.planificacion_candidata_id],
                ['Fecha citacion candidata', camion.fecha_citacion_candidata],
                ['Fecha despacho candidata', camion.fecha_despacho_candidata],
                ['Estado candidato', camion.estado_citacion_candidata],
                ['Resultado busqueda', camion.resultado_busqueda_planificacion],
                ['Responsable pendiente', camion.responsable_pendiente]
            );
        }
        if (camion.es_recepcion_sbh) {
            fields.push(
                ['Tipo recepci\u00f3n', camion.tipo_recepcion_label || camion.tipo_recepcion],
                ['BL', camion.bl], ['Contenedor', camion.lote_contenedor],
                ['Fecha producci\u00f3n', camion.fecha_produccion_display || camion.fecha_produccion],
                ['Fecha vencimiento', camion.fecha_vencimiento_display || camion.fecha_vencimiento]
            );
            [['CDA', camion.cda], ['DI', camion.di], ['Nave / Naviera', camion.nave_naviera], ['SUI', camion.sui]].forEach(function (field) {
                if (field[1]) fields.push(field);
            });
        } else {
            fields.push(['BL', camion.bl], ['Lote/contenedor', camion.lote_contenedor]);
        }
        fields.push(['Guardia', camion.guardia], ['Llegada', camion.llegada], ['Observacion', camion.observacion]);
        $('#patioModalContent').html(
            validacionHtml + '<div id="patioDataView"><div class="patio-detail-grid">' + fields.map(function (field) {
                const claseInvalida = field[2] && camposInvalidos.includes(field[2]) ? ' border border-danger rounded p-2' : '';
                return '<div class="patio-detail-item' + claseInvalida + '"><div class="patio-detail-label">' + patioEscape(field[0]) + '</div><div>' + patioEscape(field[1] || '-') + '</div></div>';
            }).join('') + '</div></div>' +
            '<div id="patioEditView" style="display:none;">' + patioRenderFormEdicion(camion) + '</div>' +
            '<h6 class="mt-3">Documentos</h6>' + patioRenderDocumentos(data)
        );
        camposInvalidos.forEach(function (campo) {
            $('#patioEditForm [name="' + campo + '"]').addClass('is-invalid');
        });
        const citaciones = data.citaciones || [];
        $('#patioCitacionesList').html(citaciones.length ? citaciones.map(function (cit) {
            const tipo = cit.tipo_label || cit.tipo || 'RECEPCION';
            const tipoNormalizado = patioNormalizarTipoCitacion(cit.tipo || tipo || 'RECEPCION');
            const tipoClass = tipoNormalizado === 'DESPACHO' ? 'badge-warning' : 'badge-success';
            const abrir = cit.abrir_url
                ? '<a class="btn btn-sm btn-outline-primary patio-open-citation" href="' + patioEscape(cit.abrir_url) + '">Abrir citacion</a>'
                : '';
            const aprobadaClass = cit.es_citacion_aprobada ? ' is-approved-citation' : '';
            const aprobadaBadge = cit.es_citacion_aprobada ? '<span class="badge badge-success">Citacion aprobada</span>' : '';
            const esDespacho = tipoNormalizado === 'DESPACHO';
            const secuencia = cit.secuencia_operacional || {};
            const secuenciaNombre = secuencia.nombre || 'No informada';
            let patenteBloque = '';
            if (esDespacho) {
                let patenteEstado = '<span class="text-muted">Patente pendiente</span>';
                if (cit.patente) {
                    patenteEstado = '<strong>' + patioEscape(cit.patente) + '</strong>';
                    if (cit.patente_coincide) {
                        patenteEstado += ' <span class="badge badge-success">Patente coincide</span>';
                    } else {
                        patenteEstado += ' <span class="badge badge-light border">Patente no coincide</span>' +
                            '<div class="patio-muted">Camion en patio: ' + patioEscape(camion.patente || '-') + '<br>Citacion: ' + patioEscape(cit.patente || '-') + '</div>';
                    }
                }
                patenteBloque = '<div><span class="patio-muted">Patente</span><br>' + patenteEstado + '</div>';
            }
            let blBloque = '';
            if (cit.bl) {
                let blEstado = '';
                if (cit.bl_estado === 'coincide') {
                    blEstado = ' <span class="badge badge-success">BL coincide</span>';
                } else if (cit.bl_estado === 'similar') {
                    blEstado = ' <span class="badge badge-warning">BL similar &mdash; revisar dato</span>';
                }
                blBloque = '<div><span class="patio-muted">BL planificaci\u00f3n</span><br><strong>' + patioEscape(cit.bl) + '</strong>' + blEstado + '</div>';
            }
            const datosDespachoSbh = cit.es_despacho_sbh
                ? '<div><span class="patio-muted">Tipo documento</span><br>' + patioEscape(cit.salida_documento_label || '-') + '</div>' +
                  '<div><span class="patio-muted">Destino</span><br>' + patioEscape(cit.destino || '-') + '</div>' +
                  '<div><span class="patio-muted">Ventana horaria</span><br>' + patioEscape(cit.ventana_horaria || '-') + '</div>'
                : '';
            return '<div class="patio-citation-option citacion-sugerida-card' + aprobadaClass + '" data-citacion-id="' + patioEscape(cit.id) + '" data-tipo-citacion="' + patioEscape(tipoNormalizado) + '">' +
                '<div class="d-flex justify-content-between align-items-start flex-wrap" style="gap:8px;">' +
                '<div class="patio-citation-heading"><strong>Citacion #' + patioEscape(cit.id) + '</strong><span class="badge ' + tipoClass + '">' + patioEscape(tipo) + '</span>' + aprobadaBadge + '</div>' +
                '<div class="d-flex flex-wrap" style="gap:6px;"><span class="badge badge-primary">Score ' + patioEscape(cit.score) + '</span>' + abrir + '</div>' +
                '</div>' +
                '<div class="patio-citation-grid mt-2">' +
                '<div><span class="patio-muted">Producto</span><br>' + patioEscape(cit.producto || '-') + '</div>' +
                '<div><span class="patio-muted">Proveedor</span><br>' + patioEscape(cit.proveedor || '-') + '</div>' +
                '<div><span class="patio-muted">Cliente</span><br>' + patioEscape(cit.cliente || '-') + '</div>' +
                '<div><span class="patio-muted">Pedido SAP</span><br>' + patioEscape(cit.pedido_sap || '-') + '</div>' +
                datosDespachoSbh +
                blBloque +
                '<div><span class="patio-muted">Planificacion</span><br>' + patioEscape(cit.planificacion || '-') + '</div>' +
                '<div><span class="patio-muted">Secuencia operacional</span><br><strong class="patio-sequence-value">' + patioEscape(secuenciaNombre) + '</strong></div>' +
                patenteBloque +
                '<div><span class="patio-muted">Fecha</span><br>' + patioEscape(cit.fecha_planificacion || '-') + '</div>' +
                '</div><div class="patio-muted mt-2">' + patioEscape((cit.razones || []).join(', ') || 'Sin coincidencias fuertes') + '</div></div>';
        }).join('') : '<div class="alert alert-warning">No hay citaciones abiertas disponibles.</div>');
        patioPrepararFiltrosCitaciones(!!citaciones.length);
    }

    function abrirCamionPatio(id) {
        $('#patioModalAlert').hide().text('');
        $('#btnEditarCamionPatio').hide();
        $('#patioModalContent').html('<div class="text-center p-3">Cargando...</div>');
        $('#patioCitacionesList').empty();
        $('#camionPatioModal').modal('show');
        $.get('/camiones-patio/' + id + '/detalle/', {_empresa_id: PATIO_EMPRESA_ID})
            .done(function (response) { renderPatioDetalle(response); })
            .fail(function (xhr) {
                const response = xhr.responseJSON || {};
                $('#patioModalContent').empty();
                patioAlert(response.message || 'No fue posible cargar el camion.', 'danger');
            });
    }

    function patioRefrescarTarjeta(camion) {
        const card = $('.patio-card[data-camion-id="' + camion.id + '"]');
        if (!card.length) return;
        card.find('.patio-card-title span:first, .patio-truck-plate').first().text(camion.patente || '');
    }

    function retirarCamionPatio(id, datos) {
        const patente = datos.patente || 'Sin patente';
        const conductor = datos.conductor || 'Sin informacion';
        const citacion = datos.citacion || 'Sin citacion';
        const llegada = datos.llegada || 'Sin informacion';
        Swal.fire({
            icon: 'warning',
            title: 'Retirar del patio',
            html: '<p>Se retirara el registro de patio, sin eliminar el camion maestro ni la citacion historica.</p><div class="text-left"><strong>Patente:</strong> ' + patioEscape(patente) + '<br><strong>Conductor:</strong> ' + patioEscape(conductor) + '<br><strong>Citacion:</strong> ' + patioEscape(citacion) + '<br><strong>Ingreso:</strong> ' + patioEscape(llegada) + '</div>',
            showCancelButton: true,
            confirmButtonText: 'Continuar',
            cancelButtonText: 'Cancelar'
        }).then(function (first) {
            if (!first.isConfirmed) return;
            return Swal.fire({
                icon: 'question',
                title: 'Confirmacion final',
                text: 'Esta accion retirara el CAMION_PATIO y sus datos operacionales dependientes. ¿Desea continuar?',
                showCancelButton: true,
                confirmButtonText: 'Retirar definitivamente',
                cancelButtonText: 'Cancelar'
            });
        }).then(function (second) {
            if (!second || !second.isConfirmed) return;
            return $.ajax({
                url: '/camiones-patio/' + id + '/retirar/',
                type: 'POST',
                headers: {'X-CSRFToken': patioCookie('csrftoken')},
                data: {_empresa_id: PATIO_EMPRESA_ID}
            });
        }).done(function (response) {
            $('.patio-card[data-camion-id="' + id + '"]').remove();
            if (patioCamionActual && String(patioCamionActual.id) === String(id)) {
                patioCamionActual = null;
                $('#camionPatioModal').modal('hide');
            }
            patioAlert(response.message || 'Camion retirado del patio.', 'success');
        }).fail(function (xhr) {
            const response = xhr.responseJSON || {};
            if (xhr.status) patioAlert(response.message || 'No fue posible retirar el camion.', 'danger');
        });
    }
    $(document).off('click', '.patio-card');
    $(document).off('click', '.btn-retirar-patio');
    $(document).on('click', '.btn-retirar-patio', function (event) {
        event.stopPropagation();
        const boton = $(this);
        retirarCamionPatio(boton.data('camion-id'), {patente: boton.data('patente'), conductor: boton.data('conductor'), citacion: boton.data('citacion'), llegada: boton.data('llegada')});
    });

    $(document).on('click', '.patio-card', function () {
        abrirCamionPatio($(this).data('camion-id'));
    });

    $(document).off('click', '.patio-citation-option');
    $(document).on('click', '.patio-citation-option', function (event) {
        if ($(event.target).closest('a,button,input,label').length) return;
        $('.patio-citation-option').removeClass('is-selected');
        $(this).addClass('is-selected');
        patioCitacionSeleccionada = $(this).data('citacion-id');
        const solicitudBloquea = patioCamionActual && ['PENDIENTE', 'APROBADO_PENDIENTE_PLANIFICACION'].includes(patioCamionActual.solicitud_estado);
        const permisos = (patioDetalleActual || {}).permisos || {};
        const validacion = (patioDetalleActual || {}).validacion_asociacion || {};
        const datosBloquean = !!validacion.aplica && !validacion.valido;
        $('#btnAsociarCamionPatio')
            .prop('disabled', !permisos.puede_asociar || !patioCamionActual || patioCamionActual.estado === 'ASOCIADO_CITACION' || solicitudBloquea || datosBloquean)
            .text(permisos.asociacion_directa_asistente_despacho ? 'Confirmar asociacion' : 'Buscar citacion');
    });

    $(document).off('click', '.patio-citation-filter-btn');
    $(document).on('click', '.patio-citation-filter-btn', function () {
        patioAplicarFiltroCitaciones($(this).data('tipo-citacion-filtro'));
    });

    $(document).off('click', '#btnNoPlanificadoPatio');
    $(document).on('click', '#btnNoPlanificadoPatio', function () {
        if (!patioCamionActual || patioCamionActual.existe_solicitud_no_planificado) return;
        const boton = $(this);
        Swal.fire({
            icon: 'question',
            title: 'Camion no planificado',
            text: '¿Confirma que este camion no corresponde a ninguna citacion y debe ser enviado a revision del planificador?',
            showCancelButton: true,
            confirmButtonText: 'Enviar a revision',
            cancelButtonText: 'Cancelar',
            target: document.body,
            focusConfirm: true,
            returnFocus: true,
            customClass: {
                container: 'swal-camion-no-planificado-container',
                popup: 'swal-camion-no-planificado-popup'
            }
        }).then(function (result) {
            if (!result.isConfirmed) return;
            boton.prop('disabled', true);
            $.ajax({
                url: '/camiones-patio/' + patioCamionActual.id + '/no-planificado/',
                type: 'POST',
                headers: {'X-CSRFToken': patioCookie('csrftoken')},
                data: {_empresa_id: PATIO_EMPRESA_ID}
            }).done(function (response) {
                patioCamionActual = response.camion || patioCamionActual;
                if (patioDetalleActual) patioDetalleActual.camion = patioCamionActual;
                patioRenderNoPlanificado(patioCamionActual, (patioDetalleActual || {}).permisos || {});
                $('#btnAsociarCamionPatio').prop('disabled', true);
                patioAlert(response.message || 'Solicitud registrada.', response.teams_enviado ? 'success' : 'warning');
            }).fail(function (xhr) {
                const response = xhr.responseJSON || {};
                patioAlert(response.message || 'No fue posible registrar la solicitud.', 'danger');
                boton.prop('disabled', false);
                if (response.solicitud_id) abrirCamionPatio(patioCamionActual.id);
            });
        });
    });

    $(document).off('click', '#btnReintentarTeamsPatio');
    $(document).on('click', '#btnReintentarTeamsPatio', function () {
        if (!patioCamionActual || !patioCamionActual.solicitud_id) return;
        const boton = $(this).prop('disabled', true);
        $.ajax({
            url: '/camiones-patio/no-planificado/' + patioCamionActual.solicitud_id + '/reintentar-teams/',
            type: 'POST',
            headers: {'X-CSRFToken': patioCookie('csrftoken')},
            data: {_empresa_id: PATIO_EMPRESA_ID}
        }).done(function (response) {
            patioCamionActual.teams_enviado = !!response.teams_enviado;
            patioCamionActual.teams_estado = response.teams_estado || '';
            patioRenderNoPlanificado(patioCamionActual, (patioDetalleActual || {}).permisos || {});
            patioAlert(response.message || 'Notificacion enviada a Teams.', 'success');
        }).fail(function (xhr) {
            const response = xhr.responseJSON || {};
            patioCamionActual.teams_estado = response.teams_estado || patioCamionActual.teams_estado;
            patioRenderNoPlanificado(patioCamionActual, (patioDetalleActual || {}).permisos || {});
            patioAlert(response.message || 'No fue posible reenviar a Teams.', 'warning');
            boton.prop('disabled', false);
        });
    });

    $(document).on('click', '#btnEditarCamionPatio', function () {
        $('#patioDataView').hide();
        $('#patioEditView').show();
        patioActualizarCamposRecepcionEdicion(false);
        $(this).hide();
    });

    $(document).on('change', '#patioEditTipoRecepcion', function () {
        patioActualizarCamposRecepcionEdicion(true);
    });
    $(document).on('click', '#btnCancelarEdicionPatio', function () {
        $('#patioEditView').hide();
        $('#patioDataView').show();
        $('#btnEditarCamionPatio').show();
    });

$(document).on('input blur', '#patioEditForm [name="rut_conductor"]', function () {
        patioValidarRutEdicion();
    });

    $(document).on('submit', '#patioEditForm', function (event) {
        event.preventDefault();
        if (!patioCamionActual || !patioValidarRutEdicion()) return;
        $.ajax({
            url: '/camiones-patio/' + patioCamionActual.id + '/actualizar/',
            type: 'POST',
            headers: {'X-CSRFToken': patioCookie('csrftoken')},
            data: $(this).serialize() + '&_empresa_id=' + encodeURIComponent(PATIO_EMPRESA_ID)
        }).done(function (response) {
            renderPatioDetalle(response);
            patioRefrescarTarjeta(response.camion || {});
            patioAlert('Datos actualizados.', 'success');
        }).fail(function (xhr) {
            const response = xhr.responseJSON || {};
            patioAlert(response.message || 'No fue posible guardar los datos.', 'danger');
        });
    });

    $(document).on('change', '.patio-doc-input', function () {
        if (!patioCamionActual || !this.files || !this.files.length) return;
        const input = this;
        const data = new FormData();
        data.append('_empresa_id', PATIO_EMPRESA_ID);
        data.append('tipo_documento', $(input).data('tipo'));
        data.append('adjunto_id', $(input).data('adjunto-id') || '');
        data.append('archivo', input.files[0]);
        $.ajax({
            url: '/camiones-patio/' + patioCamionActual.id + '/adjunto/',
            type: 'POST',
            headers: {'X-CSRFToken': patioCookie('csrftoken')},
            data: data,
            processData: false,
            contentType: false
        }).done(function (response) {
            renderPatioDetalle(response);
            patioAlert('Documento actualizado.', 'success');
        }).fail(function (xhr) {
            const response = xhr.responseJSON || {};
            patioAlert(response.message || 'No fue posible guardar el documento.', 'danger');
            input.value = '';
        });
    });

    $(document).on('click', '.patio-doc-delete', function () {
        if (!patioCamionActual) return;
        const adjuntoId = $(this).data('adjunto-id');
        Swal.fire({
            icon: 'warning',
            title: 'Eliminar documento',
            text: 'El archivo se eliminara del camion en patio.',
            showCancelButton: true,
            confirmButtonText: 'Eliminar',
            cancelButtonText: 'Cancelar'
        }).then(function (result) {
            if (!result.isConfirmed) return;
            $.ajax({
                url: '/camiones-patio/adjunto/' + adjuntoId + '/eliminar/',
                type: 'POST',
                headers: {'X-CSRFToken': patioCookie('csrftoken')},
                data: {_empresa_id: PATIO_EMPRESA_ID}
            }).done(function (response) {
                renderPatioDetalle(response);
                patioAlert('Documento eliminado.', 'success');
            }).fail(function (xhr) {
                const response = xhr.responseJSON || {};
                patioAlert(response.message || 'No fue posible eliminar el documento.', 'danger');
            });
        });
    });

    function asociarDespachoSeleccionado() {
        if (!patioCamionActual || !patioCitacionSeleccionada) return;
        const validacion = (patioDetalleActual || {}).validacion_asociacion || {};
        if (validacion.aplica && !validacion.valido) {
            patioAlert((validacion.errores || ['Complete conductor y transportista antes de asociar.']).join(' '), 'warning');
            $('#patioDataView').hide();
            $('#patioEditView').show();
            return;
        }
        Swal.fire({
            icon: 'question',
            title: 'Confirmar asociacion',
            text: 'Se asociara la citacion de despacho seleccionada al camion en patio.',
            showCancelButton: true,
            confirmButtonText: 'Asociar',
            cancelButtonText: 'Cancelar'
        }).then(function(result) {
            if (!result.isConfirmed) return;
            $.ajax({
                url: '/camiones-patio/' + patioCamionActual.id + '/asociar/',
                type: 'POST',
                headers: {'X-CSRFToken': patioCookie('csrftoken')},
                data: {_empresa_id: PATIO_EMPRESA_ID, citacion_id: patioCitacionSeleccionada}
            }).done(function(response) {
                $('#camionPatioModal').modal('hide');
                Swal.fire({icon: 'success', title: 'Asociacion confirmada', text: response.message}).then(function() {
                    window.location.reload();
                });
            }).fail(function(xhr) {
                const response = xhr.responseJSON || {};
                const mensaje = response.message || 'No fue posible asociar la citacion.';
                patioAlert(mensaje, 'danger');
                if (response.code === 'RUT_CONDUCTOR_INVALIDO') {
                    Swal.fire({
                        icon: 'error',
                        title: 'No asociado',
                        text: mensaje,
                        confirmButtonText: 'Editar datos'
                    }).then(function () {
                        $('#patioDataView').hide();
                        $('#patioEditView').show();
                        $('#btnEditarCamionPatio').hide();
                        $('#patioEditForm [name="rut_conductor"]').trigger('focus');
                    });
                }
            });
        });
    }

    function abrirSelectorTipoCitacion(camionPatioId) {
        Swal.fire({
            title: 'Seleccionar tipo de citacion',
            text: 'Indique si el camion sera asociado a una citacion de Recepcion o Despacho.',
            icon: 'question',
            showDenyButton: true,
            showCancelButton: true,
            confirmButtonText: 'Recepcion',
            denyButtonText: 'Despacho',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#4099ff',
            denyButtonColor: '#2ed8b6'
        }).then(function (result) {
            if (!result.isConfirmed && !result.isDenied) return;
            const params = new URLSearchParams();
            params.set('tipo', result.isConfirmed ? 'RECEPCION' : 'DESPACHO');
            if (PATIO_EMPRESA_ID) params.set('_empresa_id', PATIO_EMPRESA_ID);
            params.set('camion_patio_id', camionPatioId);
            window.location.href = PATIO_PLANIFICACIONES_URL + '?' + params.toString();
        });
    }

    $('#btnAsociarCamionPatio').off('click');
    $('#btnAsociarCamionPatio').on('click', function () {
        if (!patioCamionActual) return;
        const permisos = (patioDetalleActual || {}).permisos || {};
        if (permisos.asociacion_directa_asistente_despacho) {
            asociarDespachoSeleccionado();
            return;
        }
        const camionPatioId = patioCamionActual.id;
        const modalDetalle = $('#camionPatioModal');
        if (modalDetalle.hasClass('show')) {
            modalDetalle.one('hidden.bs.modal', function () {
                abrirSelectorTipoCitacion(camionPatioId);
            });
            modalDetalle.modal('hide');
            return;
        }
        abrirSelectorTipoCitacion(camionPatioId);
    });

    $(function () {
        const params = new URLSearchParams(window.location.search);
        const camionPatioUrl = params.get('camion_patio') || params.get('camion_patio_id');
        if (camionPatioUrl) {
            abrirCamionPatio(camionPatioUrl);
        }
    });

    window.abrirCamionPatio = abrirCamionPatio;
})();
</script>
