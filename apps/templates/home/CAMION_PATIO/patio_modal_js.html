<script>
(function () {
    const PATIO_EMPRESA_ID = "{{ empresa_activa_id|default:'' }}";
    const PATIO_PLANIFICACIONES_URL = "{% url 'pla_listall' %}";
    let patioCamionActual = null;
    let patioCitacionSeleccionada = null;
    let patioDetalleActual = null;

    function patioEscape(value) {
        return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function patioCookie(name) {
        const cookies = document.cookie ? document.cookie.split(';') : [];
        for (const item of cookies) {
            const cookie = item.trim();
            if (cookie.startsWith(name + '=')) return decodeURIComponent(cookie.slice(name.length + 1));
        }
        return '';
    }

    function patioNormalizarTipoCitacion(value) {
        return String(value || '')
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toUpperCase()
            .trim();
    }

    function patioAlert(message, type) {
        $('#patioModalAlert')
            .removeClass('alert-info alert-warning alert-danger alert-success')
            .addClass('alert-' + (type || 'info'))
            .show()
            .text(message || '');
    }

    function patioAplicarFiltroCitaciones(tipo) {
        const filtro = patioNormalizarTipoCitacion(tipo);
        let visibles = 0;
        $('.patio-citation-filter-btn')
            .removeClass('active btn-secondary')
            .addClass('btn-outline-secondary');
        $('.patio-citation-filter-btn').filter(function () {
            return patioNormalizarTipoCitacion($(this).data('tipo-citacion-filtro')) === filtro;
        }).addClass('active btn-secondary').removeClass('btn-outline-secondary');
        $('#patioCitacionesList .citacion-sugerida-card').each(function () {
            const card = $(this);
            const tipoCard = patioNormalizarTipoCitacion(card.data('tipo-citacion'));
            const mostrar = !filtro || tipoCard === filtro;
            card.toggle(mostrar);
            if (mostrar) visibles += 1;
        });
        $('#patioCitacionesFiltroEmpty').toggle(!!filtro && visibles === 0);
    }

    function patioPrepararFiltrosCitaciones(hayCitaciones) {
        $('.patio-citation-filter').toggle(!!hayCitaciones);
        $('#patioCitacionesFiltroEmpty').hide();
        patioAplicarFiltroCitaciones('');
    }

    function patioField(name, label, value, required) {
        return '<div class="form-group mb-0">' +
            '<label>' + patioEscape(label) + (required ? ' *' : '') + '</label>' +
            '<input type="text" class="form-control" name="' + patioEscape(name) + '" value="' + patioEscape(value || '') + '"' + (required ? ' required' : '') + '>' +
            '</div>';
    }

    function patioRenderFormEdicion(camion) {
        return '<form id="patioEditForm">' +
            '<div class="patio-edit-form-grid">' +
            patioField('transportista', 'Empresa transporte', camion.transportista, true) +
            patioField('conductor', 'Nombre conductor', camion.conductor, true) +
            patioField('rut_conductor', 'RUT conductor', camion.rut_conductor, true) +
            patioField('telefono_conductor', 'Celular conductor', camion.telefono, true) +
            patioField('patente', 'Patente camion', camion.patente, true) +
            patioField('proveedor', 'Proveedor declarado', camion.proveedor, true) +
            patioField('cliente', 'Cliente declarado', camion.cliente, true) +
            patioField('numero_guia', 'Numero guia/documento', camion.guia, true) +
            patioField('insumo_declarado_guia', 'Insumo declarado en guia', camion.insumo_declarado_guia, true) +
            patioField('bl', 'BL', camion.bl, false) +
            patioField('lote_contenedor', 'Lote/contenedor', camion.lote_contenedor, false) +
            '</div>' +
            '<div class="form-group mt-3 mb-0">' +
            '<label>Observacion</label>' +
            '<textarea class="form-control" name="observacion" rows="3">' + patioEscape(camion.observacion || '') + '</textarea>' +
            '</div>' +
            '<div class="text-right mt-3">' +
            '<button type="button" class="btn btn-outline-secondary mr-2" id="btnCancelarEdicionPatio">Cancelar</button>' +
            '<button type="submit" class="btn btn-primary">Guardar datos</button>' +
            '</div>' +
            '</form>';
    }

    function patioDocumentoRow(tipo, label, adjunto, permisos) {
        const puedeGestionar = !!(permisos && permisos.puede_gestionar_adjuntos);
        const existe = !!adjunto;
        const nombre = existe ? (adjunto.nombre || '-') : 'Sin archivo';
        const meta = existe
            ? '<div class="patio-muted">' + patioEscape(adjunto.fecha_carga || '-') + (adjunto.usuario ? ' | ' + patioEscape(adjunto.usuario) : '') + '</div>'
            : '<div class="patio-muted">Pendiente de carga</div>';
        const ver = existe && adjunto.url && adjunto.disponible
            ? '<a class="btn btn-sm btn-outline-secondary" href="' + patioEscape(adjunto.url) + '" target="_blank" rel="noopener">Ver</a>'
            : '';
        const subir = puedeGestionar
            ? '<label class="btn btn-sm btn-outline-primary mb-0">' + (existe ? 'Reemplazar' : 'Subir') +
                '<input type="file" class="d-none patio-doc-input" data-tipo="' + patioEscape(tipo) + '" data-adjunto-id="' + patioEscape(existe ? adjunto.id : '') + '">' +
                '</label>'
            : '';
        const eliminar = puedeGestionar && existe && adjunto.puede_eliminar
            ? '<button type="button" class="btn btn-sm btn-outline-danger patio-doc-delete" data-adjunto-id="' + patioEscape(adjunto.id) + '">Eliminar</button>'
            : '';
        return '<div class="patio-document-row">' +
            '<div><strong>' + patioEscape(label) + '</strong></div>' +
            '<div>' + patioEscape(nombre) + meta + '</div>' +
            '<div class="d-flex flex-wrap justify-content-end" style="gap:6px;">' + ver + subir + eliminar + '</div>' +
            '</div>';
    }

    function patioRenderDocumentos(data) {
        const permisos = data.permisos || {};
        const tipos = data.tipos_documento || [];
        const adjuntos = data.adjuntos || [];
        const usados = {};
        let html = '';
        tipos.forEach(function (tipo) {
            const adjunto = adjuntos.find(function (item) {
                return item.tipo === tipo.value && !usados[item.id];
            });
            if (adjunto) usados[adjunto.id] = true;
            html += patioDocumentoRow(tipo.value, tipo.label, adjunto, permisos);
        });
        adjuntos.forEach(function (adjunto) {
            if (!usados[adjunto.id]) {
                html += patioDocumentoRow(adjunto.tipo, adjunto.tipo_label || adjunto.tipo, adjunto, permisos);
            }
        });
        return html || '<div class="text-muted">Sin adjuntos</div>';
    }

    function renderPatioDetalle(data) {
        const camion = data.camion || {};
        const permisos = data.permisos || {};
        patioDetalleActual = data;
        patioCamionActual = camion;
        patioCitacionSeleccionada = null;
        $('#btnAsociarCamionPatio').prop('disabled', camion.estado === 'ASOCIADO_CITACION');
        $('#btnEditarCamionPatio').toggle(!!permisos.puede_editar);
        $('#patioModalSubtitle').text('Patente ' + (camion.patente || ''));
        if (permisos.mensaje_bloqueo) {
            patioAlert(permisos.mensaje_bloqueo, 'warning');
        } else {
            $('#patioModalAlert').hide().text('');
        }
        const fields = [
            ['Estado', camion.estado_visible || camion.estado], ['Patente', camion.patente],
            ['Conductor', camion.conductor], ['RUT', camion.rut_conductor], ['Telefono', camion.telefono],
            ['Transportista', camion.transportista], ['Proveedor declarado', camion.proveedor],
            ['Insumo declarado en guia', camion.insumo_declarado_guia],
            ['Cliente declarado', camion.cliente], ['Guia/documento', camion.guia], ['BL', camion.bl],
            ['Lote/contenedor', camion.lote_contenedor],
            ['Guardia', camion.guardia], ['Llegada', camion.llegada],
            ['Observacion', camion.observacion]
        ];
        $('#patioModalContent').html(
            '<div id="patioDataView"><div class="patio-detail-grid">' + fields.map(function (field) {
                return '<div class="patio-detail-item"><div class="patio-detail-label">' + patioEscape(field[0]) + '</div><div>' + patioEscape(field[1] || '-') + '</div></div>';
            }).join('') + '</div></div>' +
            '<div id="patioEditView" style="display:none;">' + patioRenderFormEdicion(camion) + '</div>' +
            '<h6 class="mt-3">Documentos</h6>' + patioRenderDocumentos(data)
        );
        const citaciones = data.citaciones || [];
        $('#patioCitacionesList').html(citaciones.length ? citaciones.map(function (cit) {
            const tipo = cit.tipo_label || cit.tipo || 'RECEPCION';
            const tipoNormalizado = patioNormalizarTipoCitacion(cit.tipo || tipo || 'RECEPCION');
            const tipoClass = tipoNormalizado === 'DESPACHO' ? 'badge-warning' : 'badge-success';
            const abrir = cit.abrir_url
                ? '<a class="btn btn-sm btn-outline-primary patio-open-citation" href="' + patioEscape(cit.abrir_url) + '">Abrir citacion</a>'
                : '';
            return '<div class="patio-citation-option citacion-sugerida-card" data-citacion-id="' + patioEscape(cit.id) + '" data-tipo-citacion="' + patioEscape(tipoNormalizado) + '">' +
                '<div class="d-flex justify-content-between align-items-start flex-wrap" style="gap:8px;">' +
                '<div class="patio-citation-heading"><strong>Citacion #' + patioEscape(cit.id) + '</strong><span class="badge ' + tipoClass + '">' + patioEscape(tipo) + '</span></div>' +
                '<div class="d-flex flex-wrap" style="gap:6px;"><span class="badge badge-primary">Score ' + patioEscape(cit.score) + '</span>' + abrir + '</div>' +
                '</div>' +
                '<div class="patio-citation-grid mt-2">' +
                '<div><span class="patio-muted">Producto</span><br>' + patioEscape(cit.producto || '-') + '</div>' +
                '<div><span class="patio-muted">Proveedor</span><br>' + patioEscape(cit.proveedor || '-') + '</div>' +
                '<div><span class="patio-muted">Cliente</span><br>' + patioEscape(cit.cliente || '-') + '</div>' +
                '<div><span class="patio-muted">Pedido SAP</span><br>' + patioEscape(cit.pedido_sap || '-') + '</div>' +
                '<div><span class="patio-muted">Planificacion</span><br>' + patioEscape(cit.planificacion || '-') + '</div>' +
                '<div><span class="patio-muted">Fecha</span><br>' + patioEscape(cit.fecha_planificacion || '-') + '</div>' +
                '</div><div class="patio-muted mt-2">' + patioEscape((cit.razones || []).join(', ') || 'Sin coincidencias fuertes') + '</div></div>';
        }).join('') : '<div class="alert alert-warning">No hay citaciones abiertas disponibles.</div>');
        patioPrepararFiltrosCitaciones(!!citaciones.length);
    }

    function abrirCamionPatio(id) {
        $('#patioModalAlert').hide().text('');
        $('#btnEditarCamionPatio').hide();
        $('#patioModalContent').html('<div class="text-center p-3">Cargando...</div>');
        $('#patioCitacionesList').empty();
        $('#camionPatioModal').modal('show');
        $.get('/camiones-patio/' + id + '/detalle/', {_empresa_id: PATIO_EMPRESA_ID})
            .done(function (response) { renderPatioDetalle(response); })
            .fail(function (xhr) {
                const response = xhr.responseJSON || {};
                $('#patioModalContent').empty();
                patioAlert(response.message || 'No fue posible cargar el camion.', 'danger');
            });
    }

    function patioRefrescarTarjeta(camion) {
        const card = $('.patio-card[data-camion-id="' + camion.id + '"]');
        if (!card.length) return;
        card.find('.patio-card-title span:first, .patio-truck-plate').first().text(camion.patente || '');
    }

    $(document).off('click', '.patio-card');
    $(document).on('click', '.patio-card', function () {
        abrirCamionPatio($(this).data('camion-id'));
    });

    $(document).off('click', '.patio-citation-option');
    $(document).on('click', '.patio-citation-option', function (event) {
        if ($(event.target).closest('a,button,input,label').length) return;
        $('.patio-citation-option').removeClass('is-selected');
        $(this).addClass('is-selected');
        patioCitacionSeleccionada = $(this).data('citacion-id');
        $('#btnAsociarCamionPatio').prop('disabled', !patioCamionActual || patioCamionActual.estado === 'ASOCIADO_CITACION');
    });

    $(document).off('click', '.patio-citation-filter-btn');
    $(document).on('click', '.patio-citation-filter-btn', function () {
        patioAplicarFiltroCitaciones($(this).data('tipo-citacion-filtro'));
    });

    $(document).on('click', '#btnEditarCamionPatio', function () {
        $('#patioDataView').hide();
        $('#patioEditView').show();
        $(this).hide();
    });

    $(document).on('click', '#btnCancelarEdicionPatio', function () {
        $('#patioEditView').hide();
        $('#patioDataView').show();
        $('#btnEditarCamionPatio').show();
    });

    $(document).on('submit', '#patioEditForm', function (event) {
        event.preventDefault();
        if (!patioCamionActual) return;
        $.ajax({
            url: '/camiones-patio/' + patioCamionActual.id + '/actualizar/',
            type: 'POST',
            headers: {'X-CSRFToken': patioCookie('csrftoken')},
            data: $(this).serialize() + '&_empresa_id=' + encodeURIComponent(PATIO_EMPRESA_ID)
        }).done(function (response) {
            renderPatioDetalle(response);
            patioRefrescarTarjeta(response.camion || {});
            patioAlert('Datos actualizados.', 'success');
        }).fail(function (xhr) {
            const response = xhr.responseJSON || {};
            patioAlert(response.message || 'No fue posible guardar los datos.', 'danger');
        });
    });

    $(document).on('change', '.patio-doc-input', function () {
        if (!patioCamionActual || !this.files || !this.files.length) return;
        const input = this;
        const data = new FormData();
        data.append('_empresa_id', PATIO_EMPRESA_ID);
        data.append('tipo_documento', $(input).data('tipo'));
        data.append('adjunto_id', $(input).data('adjunto-id') || '');
        data.append('archivo', input.files[0]);
        $.ajax({
            url: '/camiones-patio/' + patioCamionActual.id + '/adjunto/',
            type: 'POST',
            headers: {'X-CSRFToken': patioCookie('csrftoken')},
            data: data,
            processData: false,
            contentType: false
        }).done(function (response) {
            renderPatioDetalle(response);
            patioAlert('Documento actualizado.', 'success');
        }).fail(function (xhr) {
            const response = xhr.responseJSON || {};
            patioAlert(response.message || 'No fue posible guardar el documento.', 'danger');
            input.value = '';
        });
    });

    $(document).on('click', '.patio-doc-delete', function () {
        if (!patioCamionActual) return;
        const adjuntoId = $(this).data('adjunto-id');
        Swal.fire({
            icon: 'warning',
            title: 'Eliminar documento',
            text: 'El archivo se eliminara del camion en patio.',
            showCancelButton: true,
            confirmButtonText: 'Eliminar',
            cancelButtonText: 'Cancelar'
        }).then(function (result) {
            if (!result.isConfirmed) return;
            $.ajax({
                url: '/camiones-patio/adjunto/' + adjuntoId + '/eliminar/',
                type: 'POST',
                headers: {'X-CSRFToken': patioCookie('csrftoken')},
                data: {_empresa_id: PATIO_EMPRESA_ID}
            }).done(function (response) {
                renderPatioDetalle(response);
                patioAlert('Documento eliminado.', 'success');
            }).fail(function (xhr) {
                const response = xhr.responseJSON || {};
                patioAlert(response.message || 'No fue posible eliminar el documento.', 'danger');
            });
        });
    });

    function abrirSelectorTipoCitacion(camionPatioId) {
        Swal.fire({
            title: 'Seleccionar tipo de citacion',
            text: 'Indique si el camion sera asociado a una citacion de Recepcion o Despacho.',
            icon: 'question',
            showDenyButton: true,
            showCancelButton: true,
            confirmButtonText: 'Recepcion',
            denyButtonText: 'Despacho',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#4099ff',
            denyButtonColor: '#2ed8b6'
        }).then(function (result) {
            if (!result.isConfirmed && !result.isDenied) return;
            const params = new URLSearchParams();
            params.set('tipo', result.isConfirmed ? 'RECEPCION' : 'DESPACHO');
            if (PATIO_EMPRESA_ID) params.set('_empresa_id', PATIO_EMPRESA_ID);
            params.set('camion_patio_id', camionPatioId);
            window.location.href = PATIO_PLANIFICACIONES_URL + '?' + params.toString();
        });
    }

    $('#btnAsociarCamionPatio').off('click');
    $('#btnAsociarCamionPatio').on('click', function () {
        if (!patioCamionActual) return;
        const camionPatioId = patioCamionActual.id;
        const modalDetalle = $('#camionPatioModal');
        if (modalDetalle.hasClass('show')) {
            modalDetalle.one('hidden.bs.modal', function () {
                abrirSelectorTipoCitacion(camionPatioId);
            });
            modalDetalle.modal('hide');
            return;
        }
        abrirSelectorTipoCitacion(camionPatioId);
    });

    $(function () {
        const params = new URLSearchParams(window.location.search);
        const camionPatioUrl = params.get('camion_patio') || params.get('camion_patio_id');
        if (camionPatioUrl) {
            abrirCamionPatio(camionPatioUrl);
        }
    });

    window.abrirCamionPatio = abrirCamionPatio;
})();
</script>
