    function anexarContratoSapDespacho() {
        if (!asignacionesSapPlanificadas.length) {
            swalFront({ title: 'Atencion', text: 'Confirme primero un contrato SAP.', icon: 'warning' });
            return;
        }
        contadorAsignacionesSap += 1;
        crearBloqueAsignacionSap(contadorAsignacionesSap);
    }

    function seleccionarAsignacionSap(asignacionId, item) {
        const ocCliente = String(item.oc_cliente || '').trim();
        if (ES_DESPACHO_SBH_ETAPA0 && (item.selectable === false || !ocCliente)) {
            const bloqueSinOc = $('.despacho-asignacion-sap[data-asignacion-id="' + asignacionId + '"]');
            delete vistasPreviasSapDespacho[asignacionId];
            delete stockFisicoSapPorAsignacion[asignacionId];
            bloqueSinOc.find('.js-despacho-sap-busqueda').val(null).trigger('change');
            actualizarDetalleVisualAsignacionSap(asignacionId);
            swalFront({
                title: 'Acuerdo sin OC',
                text: item.selection_block_reason
                    || 'Este acuerdo no posee una OC asociada y no puede utilizarse para planificar.',
                icon: 'info'
            });
            return;
        }
        const sapAbsId = numeroSapDespacho(item.sap_abs_id);
        const lineaAcuerdo = numeroSapDespacho(item.linea_acuerdo);
        const clienteCodigo = numeroSapDespacho(item.cliente_codigo);
        const candidatas = asignacionesSapPlanificadas.concat(Object.values(vistasPreviasSapDespacho));
        const duplicada = candidatas.some(function (asignacion) {
            return asignacion.ui_id !== asignacionId
                && asignacion.sap_abs_id === sapAbsId
                && asignacion.linea_acuerdo_sap === lineaAcuerdo;
        });
        const otroCliente = candidatas.some(function (asignacion) {
            return asignacion.ui_id !== asignacionId
                && asignacion.cliente_codigo
                && asignacion.cliente_codigo !== clienteCodigo;
        });
        const bloque = $('.despacho-asignacion-sap[data-asignacion-id="' + asignacionId + '"]');

        if (duplicada || otroCliente) {
            delete vistasPreviasSapDespacho[asignacionId];
            delete stockFisicoSapPorAsignacion[asignacionId];
            bloque.find('.js-despacho-sap-busqueda').val(null).trigger('change');
            actualizarDetalleVisualAsignacionSap(asignacionId);
            swalFront({
                title: 'Contrato no permitido',
                text: duplicada
                    ? 'La misma linea de acuerdo SAP ya fue agregada al despacho.'
                    : 'Todos los contratos anexados deben pertenecer al mismo cliente SAP.',
                icon: 'warning'
            });
            return;
        }

        const saldoContrato = saldoContratoSapDespacho(item);
        const vistaPrevia = {
            ui_id: asignacionId,
            sap_abs_id: sapAbsId,
            contrato_sap: numeroSapDespacho(item.sap_acuerdo_numero),
            linea_acuerdo_sap: lineaAcuerdo,
            codigo_producto_sap: numeroSapDespacho(item.codigo_insumo),
            nombre_producto_sap: item.nombre_insumo || '',
            cliente_codigo: clienteCodigo,
            cliente_nombre: item.cliente_nombre || '',
            oc_cliente: ocCliente,
            cantidad_planificada_sap: numeroSapDespacho(item.cantidad_planificada),
            cantidad_consumida_sap: numeroSapDespacho(item.cantidad_consumida),
            saldo_contrato_sap: saldoContrato !== null ? numeroSapDespacho(saldoContrato) : '',
            unidad_medida: item.unidad_medida || '',
            cantidad_intentada_despachar: '',
            orden: 0,
            estado: 'PLANIFICADA'
        };
        vistasPreviasSapDespacho[asignacionId] = vistaPrevia;
        stockFisicoSapPorAsignacion[asignacionId] = { estado: 'cargando' };

        actualizarDetalleVisualAsignacionSap(asignacionId);
        consultarStockFisicoSap(asignacionId, vistaPrevia.codigo_producto_sap);
        if (!asignacionesSapPlanificadas.length) {
            setDespachoSelectOption('#despacho_cliente', clienteCodigo, vistaPrevia.cliente_nombre || clienteCodigo);
        }
        cargarDireccionesDespachoSbh(clienteCodigo);
        evaluarAdvertenciaSaldoDespacho();
    }

    function textoCantidadStockSap(valor) {
        const numero = Number(valor);
        if (!Number.isFinite(numero)) return '0';
        return numero.toFixed(5).replace(/0+$/, '').replace(/\.$/, '');
    }

    function aplicarStockFisicoSap(asignacionId, itemCode, stock) {
        const asignacion = obtenerAsignacionSapPorId(asignacionId) || obtenerVistaPreviaSapPorId(asignacionId);
        if (!asignacion || String(asignacion.codigo_producto_sap || '') !== String(itemCode || '')) return;
        stockFisicoSapPorAsignacion[asignacionId] = stock;
        actualizarDetalleVisualAsignacionSap(asignacionId);
    }

    function consultarStockFisicoSap(asignacionId, itemCode) {
        itemCode = String(itemCode || '').trim();
        if (!ES_DESPACHO_SBH_ETAPA0 || !itemCode) return;
        stockFisicoSapPorAsignacion[asignacionId] = { estado: 'cargando' };
        if (stockFisicoSapCache[itemCode]) {
            aplicarStockFisicoSap(asignacionId, itemCode, stockFisicoSapCache[itemCode]);
            return;
        }
        $.ajax({
            url: '/api/sap/despacho-stock/',
            type: 'GET',
            data: { item_code: itemCode, _empresa_id: getValue('empresa_id') },
            success: function (response) {
                const stock = response && response.ok && response.available
                    ? { estado: 'disponible', datos: response }
                    : { estado: 'no_disponible' };
                stockFisicoSapCache[itemCode] = stock;
                aplicarStockFisicoSap(asignacionId, itemCode, stock);
            },
            error: function () {
                const stock = { estado: 'no_disponible' };
                stockFisicoSapCache[itemCode] = stock;
                aplicarStockFisicoSap(asignacionId, itemCode, stock);
            }
        });
    }

    function renderizarStockFisicoSap(asignacionId, asignacion, bloque) {
        const total = bloque.find('.js-sap-stock-total');
        const detalle = bloque.find('.js-sap-stock-warehouses').empty();
        const stock = stockFisicoSapPorAsignacion[asignacionId];
        if (!stock || stock.estado === 'cargando') {
            total.text('Consultando stock físico SAP...');
            detalle.text('Consultando estanques...');
            return;
        }
        if (stock.estado !== 'disponible') {
            total.text('Stock físico SAP no disponible temporalmente.');
            detalle.text('Stock físico SAP no disponible temporalmente.');
            return;
        }

        const datos = stock.datos || {};
        const unidad = String(datos.unit || asignacion.unidad_medida || '').trim();
        const sufijoUnidad = unidad ? ' ' + unidad : '';
        total.text(textoCantidadStockSap(datos.stock_total) + sufijoUnidad);
        const warehouses = datos.warehouses || [];
        if (!warehouses.length) {
            detalle.text('Sin existencia física disponible en SAP.');
            return;
        }
        warehouses.forEach(function (warehouse) {
            $('<div>').text(
                String(warehouse.whs_code || '-') + ' — ' +
                String(warehouse.whs_name || '-') + ' — ' +
                textoCantidadStockSap(warehouse.on_hand) + sufijoUnidad
            ).appendTo(detalle);
        });
    }
    function actualizarDetalleVisualAsignacionSap(asignacionId) {
        const confirmada = obtenerAsignacionSapPorId(asignacionId);
        const asignacion = confirmada || obtenerVistaPreviaSapPorId(asignacionId);
        const bloque = $('.despacho-asignacion-sap[data-asignacion-id="' + asignacionId + '"]');
        const detalle = bloque.find('.despacho-asignacion-sap-detalle');
        if (!asignacion) {
            detalle.addClass('d-none');
            bloque.removeClass('is-confirmed');
            bloque.find('.js-sap-confirmado').addClass('d-none');
            return;
        }
        detalle.removeClass('d-none');
        bloque.find('.js-sap-acuerdo').text(asignacion.contrato_sap || '-');
        bloque.find('.js-sap-linea').text(asignacion.linea_acuerdo_sap || '-');
        bloque.find('.js-sap-producto').text(asignacion.nombre_producto_sap || asignacion.codigo_producto_sap || '-');
        bloque.find('.js-sap-oc').text(asignacion.oc_cliente || '-');
        bloque.find('.js-sap-planificada').text(asignacion.cantidad_planificada_sap || '-');
        bloque.find('.js-sap-consumida').text(asignacion.cantidad_consumida_sap || '-');
        bloque.find('.js-sap-saldo').text(asignacion.saldo_contrato_sap || '-');
        renderizarStockFisicoSap(asignacionId, asignacion, bloque);
        bloque.toggleClass('is-confirmed', Boolean(confirmada));
        bloque.find('.js-sap-confirmado').toggleClass('d-none', !confirmada);
        bloque.find('.js-sap-confirmar').toggleClass('d-none', Boolean(confirmada));
        bloque.find('.js-despacho-sap-busqueda').prop('disabled', Boolean(confirmada)).trigger('change.select2');
        bloque.find('.js-sap-cantidad-intentada')
            .val(asignacion.cantidad_intentada_despachar || '')
            .prop('disabled', false)
            .off('.asignacionSap')
            .on('input.asignacionSap change.asignacionSap', function () {
                asignacion.cantidad_intentada_despachar = $(this).val();
                evaluarAdvertenciaSaldoDespacho();
                recalcularResumenDespachoSbh();
            });
    }

    function confirmarAsignacionSap(asignacionId) {
        const vistaPrevia = obtenerVistaPreviaSapPorId(asignacionId);
        const bloque = $('.despacho-asignacion-sap[data-asignacion-id="' + asignacionId + '"]');
        if (!vistaPrevia) {
            swalFront({ title: 'Contrato no seleccionado', text: 'Seleccione un acuerdo SAP antes de confirmarlo.', icon: 'warning' });
            return;
        }

        vistaPrevia.cantidad_intentada_despachar = bloque.find('.js-sap-cantidad-intentada').val();
        const cantidad = normalizarDecimalDespacho(vistaPrevia.cantidad_intentada_despachar);
        if (!vistaPrevia.contrato_sap || !vistaPrevia.sap_abs_id || !vistaPrevia.linea_acuerdo_sap || !vistaPrevia.codigo_producto_sap) {
            swalFront({ title: 'Contrato incompleto', text: 'El contrato debe incluir acuerdo, AbsID, linea y producto SAP.', icon: 'warning' });
            return;
        }
        if (cantidad === null || cantidad <= 0) {
            swalFront({ title: 'Cantidad no valida', text: 'Ingrese una cantidad intentada a despachar mayor que cero.', icon: 'warning' });
            return;
        }

        const cliente = String($('#despacho_cliente').val() || '');
        if (!vistaPrevia.cliente_codigo || (cliente && vistaPrevia.cliente_codigo !== cliente)) {
            swalFront({ title: 'Cliente no coincide', text: 'El cliente del despacho debe coincidir con el contrato SAP.', icon: 'warning' });
            return;
        }

        asignacionesSapPlanificadas.push(vistaPrevia);
        delete vistasPreviasSapDespacho[asignacionId];
        normalizarOrdenAsignacionesSap();
        actualizarDetalleVisualAsignacionSap(asignacionId);
        sincronizarPrimeraAsignacionSap();
        evaluarAdvertenciaSaldoDespacho();
        recalcularResumenDespachoSbh();
    }

    function reiniciarBloqueAsignacionSap(asignacionId) {
        const bloque = $('.despacho-asignacion-sap[data-asignacion-id="' + asignacionId + '"]');
        const select = bloque.find('.js-despacho-sap-busqueda');
        select.prop('disabled', false).val(null).trigger('change');
        bloque.removeClass('is-confirmed');
        bloque.find('.js-sap-confirmado').addClass('d-none');
        bloque.find('.js-sap-confirmar').removeClass('d-none');
        bloque.find('.js-sap-cantidad-intentada').prop('disabled', false).val('');
        actualizarDetalleVisualAsignacionSap(asignacionId);
    }

    function hayAsignacionesSapSinConfirmar() {
        return Object.values(vistasPreviasSapDespacho).some(function (asignacion) {
            return Boolean(asignacion && asignacion.sap_abs_id);
        });
    }

    function sincronizarPrimeraAsignacionSap() {
        const primera = asignacionesSapPlanificadas[0] || null;
        despachoSapSeleccionado = primera;
        $('#despacho_anexar_contrato').prop('disabled', !primera);
        [
            'despacho_codigo_sap', 'despacho_nombre_producto_sap', 'despacho_numero_acuerdo_sap',
            'despacho_abs_id_sap', 'despacho_linea_acuerdo_sap', 'despacho_cantidad_planificada_sap',
            'despacho_cantidad_consumida_sap', 'despacho_cantidad_pendiente_sap',
            'despacho_saldo_contrato_sap', 'despacho_estado_saldo_sap', 'despacho_insumo',
            'despacho_oc', 'despacho_cantidad_intentada'
        ].forEach(function (id) { setValue(id, ''); });
        if (!primera) {
            recalcularResumenDespachoSbh();
            return;
        }

        setValue('despacho_codigo_sap', primera.codigo_producto_sap);
        setValue('despacho_nombre_producto_sap', primera.nombre_producto_sap);
        setValue('despacho_numero_acuerdo_sap', primera.contrato_sap);
        setValue('despacho_abs_id_sap', primera.sap_abs_id);
        setValue('despacho_linea_acuerdo_sap', primera.linea_acuerdo_sap);
        setValue('despacho_cantidad_planificada_sap', primera.cantidad_planificada_sap);
        setValue('despacho_cantidad_consumida_sap', primera.cantidad_consumida_sap);
        setValue('despacho_saldo_contrato_sap', primera.saldo_contrato_sap);
        setValue('despacho_cantidad_intentada', primera.cantidad_intentada_despachar);
        setDespachoSelectOption('#despacho_cliente', primera.cliente_codigo, primera.cliente_nombre || primera.cliente_codigo);
        setValue('despacho_oc', primera.oc_cliente);
        setValue('despacho_insumo', primera.nombre_producto_sap);
        recalcularResumenDespachoSbh();
    }

    function eliminarAsignacionSap(asignacionId) {
        asignacionId = Number(asignacionId);
        const bloque = $('.despacho-asignacion-sap[data-asignacion-id="' + asignacionId + '"]');
        delete vistasPreviasSapDespacho[asignacionId];
        delete stockFisicoSapPorAsignacion[asignacionId];
        asignacionesSapPlanificadas = asignacionesSapPlanificadas.filter(function (asignacion) {
            return asignacion.ui_id !== asignacionId;
        });
        normalizarOrdenAsignacionesSap();
        if (asignacionId === 1) {
            reiniciarBloqueAsignacionSap(asignacionId);
        } else {
            const select = bloque.find('.js-despacho-sap-busqueda');
            if (select.hasClass('select2-hidden-accessible')) select.select2('destroy');
            bloque.remove();
        }
        sincronizarPrimeraAsignacionSap();
        evaluarAdvertenciaSaldoDespacho();
    }

    function evaluarAdvertenciaSaldoDespacho() {
        let existeAdvertencia = false;
        $('.despacho-asignacion-sap').each(function () {
            const asignacionId = Number($(this).data('asignacion-id'));
            const asignacion = obtenerAsignacionSapPorId(asignacionId) || obtenerVistaPreviaSapPorId(asignacionId);
            if (!asignacion) {
                $(this).find('.js-sap-supera-saldo').addClass('d-none');
                return;
            }
            const cantidad = normalizarDecimalDespacho(asignacion.cantidad_intentada_despachar);
            const saldo = normalizarDecimalDespacho(asignacion.saldo_contrato_sap);
            const supera = cantidad !== null && saldo !== null && cantidad > saldo;
            $(this).find('.js-sap-supera-saldo').toggleClass('d-none', !supera);
            existeAdvertencia = existeAdvertencia || supera;
        });
        $('#despacho_sap_supera_saldo_alert').toggleClass('d-none', !existeAdvertencia);
    }

    function validarAsignacionesSapDespacho() {
        if (hayAsignacionesSapSinConfirmar()) {
            swalFront({ title: 'Contrato sin confirmar', text: 'Debe confirmar el contrato SAP seleccionado antes de crear el despacho.', icon: 'warning' });
            return false;
        }
        if (!asignacionesSapPlanificadas.length) {
            if (ES_DESPACHO_SBH_ETAPA0) {
                swalFront({ title: 'Contrato requerido', text: 'Debe confirmar al menos un contrato SAP.', icon: 'warning' });
                return false;
            }
            return true;
        }
        for (const asignacion of asignacionesSapPlanificadas) {
            const cantidad = normalizarDecimalDespacho(asignacion.cantidad_intentada_despachar);
            if (!asignacion.contrato_sap || !asignacion.sap_abs_id || !asignacion.linea_acuerdo_sap || !asignacion.codigo_producto_sap) {
                swalFront({ title: 'Contrato incompleto', text: 'Cada contrato confirmado debe incluir acuerdo, AbsID, linea y producto SAP.', icon: 'warning' });
                return false;
            }
            if (cantidad === null || cantidad <= 0) {
                swalFront({ title: 'Cantidad no valida', text: 'Cada contrato SAP debe tener una cantidad intentada a despachar mayor que cero.', icon: 'warning' });
                return false;
            }
        }
        const cliente = String($('#despacho_cliente').val() || '');
        if (asignacionesSapPlanificadas.some(function (asignacion) { return asignacion.cliente_codigo !== cliente; })) {
            swalFront({ title: 'Cliente no coincide', text: 'El cliente del despacho debe coincidir con todos los contratos SAP.', icon: 'warning' });
            return false;
        }
        return true;
    }

    function cargarDatosSapDespacho(item) {
        seleccionarAsignacionSap(1, item || {});
    }

    function limpiarDatosSapDespacho(limpiarBusqueda = true) {
        asignacionesSapPlanificadas = [];
        vistasPreviasSapDespacho = {};
        stockFisicoSapPorAsignacion = {};
        stockFisicoSapCache = {};
        despachoSapSeleccionado = null;
        if (ES_DESPACHO_SBH_ETAPA0 && !citacionesTemporales.some(function (item) { return item.despacho_sbh_etapa0; })) {
            direccionesDespachoSbh = [];
            alternativasTransporteSbh = [];
            clienteDireccionesDespachoSbh = '';
            $('#despacho_direccion_sap')
                .empty()
                .append(new Option('Seleccione primero un acuerdo SAP', ''))
                .prop('disabled', true);
            setValue('despacho_destino', '');
            $('#despacho_direccion_sap_ayuda').text(
                'La dirección determina las rutas y tarifas disponibles desde Coronel.'
            );
        }
        contadorAsignacionesSap = 1;
        $('#despacho_asignaciones_sap .despacho-asignacion-sap').not('[data-asignacion-id="1"]').each(function () {
            const select = $(this).find('.js-despacho-sap-busqueda');
            if (select.hasClass('select2-hidden-accessible')) select.select2('destroy');
            $(this).remove();
        });
        reiniciarBloqueAsignacionSap(1);
        sincronizarPrimeraAsignacionSap();
        evaluarAdvertenciaSaldoDespacho();
    }

    function agregarCitacionTemporal() {
        if (!validarFormularioCitacion()) return;
        if (!validarTipoPlanificacion('RECEPCION')) return;

        let cantidad = parseInt(getValue('cantidad_repetir'));

        if (isNaN(cantidad) || cantidad < 1) {
            cantidad = 1;
        }
        const codigoSecuencia = codigoSecuenciaRecepcionSeleccionada();
        if (codigoSecuencia === CODIGO_PROSESA_PISO_2) {
            cantidad = 1;
            $('#cantidad_repetir').val(1);
        }


        if (cantidad > 50) {
            swalFront({
                title: 'Cantidad no permitida',
                text: 'La cantidad máxima permitida para crear es 50.',
                icon: 'warning'
            });
            return;
        }

        const clienteSelect = $('#cliente');
        const proveedorSelect = $('#proveedor');
        const secuenciaSelect = $('#secuencia_id');

        for (let i = 0; i < cantidad; i++) {
            const citacion = {
                cliente: clienteSelect.val() || '',
                cliente_nombre: clienteSelect.find('option:selected').text().trim(),
                cliente_codigo: getValue('cliente_codigo'),

                inf_24hrs: getValue('inf_24hrs'),
                fecha_llegada: getValue('fecha_llegada'),
                tipo_operacion: getValue('tipo'),
                tipo_operacion_texto: getSelectedText('tipo'),
                flujo: FLUJO_NAVEGACION,
                secuencia_id: secuenciaSelect.val() || '',
                secuencia_nombre: secuenciaSelect.find('option:selected').text().trim(),

                tipo_carga: getValue('tipo_carga'),
                tipo_carga_texto: getSelectedText('tipo_carga'),

                codigo: getValue('codigo'),
                insumo: getSelectedData('insumo', 'itemname') || getSelectedText('insumo') || getValue('insumo'),
                pedido: getValue('pedido'),
                sap_opor_id: getValue('sap_opor_id'),

                proveedor: proveedorSelect.val() || '',
                proveedor_nombre: proveedorSelect.find('option:selected').text().trim(),
                proveedor_codigo: getValue('proveedor_codigo'),
                codigo_proveedor_sap: getValue('codigo_proveedor_sap'),
                contrato_sap: getValue('contrato_sap'),
                tipo_origen_recepcion: ES_RECEPCION_SBH ? getValue('tipo_origen_recepcion') : '',

                contenedor: ES_RECEPCION_SBH ? getValue('contenedor') : '',
                bl: getValue('bl'),
                guia: ES_RECEPCION_SBH ? getValue('guia') : '',
                guia_origen_prosesa: esProsesaPiso2Seleccionado() ? getValue('guia_origen_prosesa').trim() : '',
                fecha_produccion: ES_RECEPCION_SBH ? getValue('fecha_produccion') : '',
                fecha_vencimiento: ES_RECEPCION_SBH ? getValue('fecha_vencimiento') : '',
                cda: ES_RECEPCION_SBH ? getValue('cda') : '',
                di: ES_RECEPCION_SBH ? getValue('di') : '',
                sui: ES_RECEPCION_SBH ? getValue('sui') : '',
                nave_naviera: ES_RECEPCION_SBH ? getValue('nave_naviera') : '',
                booking: ES_RECEPCION_SBH ? getValue('booking') : '',
                cantidad_disponible: getValue('cantidad_disponible'),
                docentry: getValue('docentry'),
                line_num: getValue('line_num'),

                almacen_destino: ES_RECEPCION_SBH ? getValue('recepcion_sbh_almacen_destino') : '',
                estanque_destino: ES_RECEPCION_SBH ? getValue('recepcion_sbh_estanque_destino') : getValue('estanque_destino'),
                estanque_destino_texto: ES_RECEPCION_SBH ? getSelectedText('recepcion_sbh_estanque_destino') : getSelectedText('estanque_destino'),

                observacion: getValue('observacion')

            if (codigoSecuencia === CODIGO_PROSESA_PISO_2) {

                    _prosesa_origen_id: origenProsesaPiso2Cargado.origen_id,

                });

    function toneladasAUnidadesSbh(valor) {
        const numero = normalizarDecimalDespacho(valor);
        return numero !== null && Number.isFinite(numero) ? Math.round(numero * ESCALA_TONELADAS_SBH) : null;
    }

    function toneladasNaturalesSbh(valor) {
        const unidades = Number.isInteger(valor) ? valor : toneladasAUnidadesSbh(valor);
        if (unidades === null) return '0';
        return (unidades / ESCALA_TONELADAS_SBH).toFixed(5).replace(/0+$/, '').replace(/\.$/, '');
    }

    function estadoTotalDespachoSbh() {
        if (!ES_DESPACHO_SBH_ETAPA0 || !asignacionesSapPlanificadas.length) return { valido: false, total: 0 };
        let total = 0;
        for (const asignacion of asignacionesSapPlanificadas) {
            const cantidad = toneladasAUnidadesSbh(asignacion.cantidad_intentada_despachar);
            if (cantidad === null || cantidad <= 0) return { valido: false, total: 0 };
            total += cantidad;
        }
        return { valido: total > 0, total: total };
    }

    function capacidadDespachoSbh() {
        const formato = String($('#despacho_formato').val() || '');
        if (formato === 'IBC') return 18 * ESCALA_TONELADAS_SBH;
        return CAPACIDAD_FORMATO_DESPACHO_SBH[formato]
            ? Math.round(CAPACIDAD_FORMATO_DESPACHO_SBH[formato] * ESCALA_TONELADAS_SBH)
            : null;
    }

    function recalcularResumenDespachoSbh() {
        if (!ES_DESPACHO_SBH_ETAPA0) return;
        const estado = estadoTotalDespachoSbh();
        const formato = $('#despacho_formato');
        $('#despacho_total_planificado').text(toneladasNaturalesSbh(estado.total));
        formato.prop('disabled', !estado.valido);
        if (!estado.valido) {
            formato.val('').trigger('change.select2');
            camionesPlanificadosDespachoSbh = [];
            firmaCalculoCamionesDespachoSbh = '';
            $('#despacho_resumen_capacidad, #despacho_camiones_planificados_seccion').addClass('d-none');
            $('#despacho_camiones_planificados').empty();
            return;
        }
        const capacidad = capacidadDespachoSbh();
        if (!capacidad) {
            camionesPlanificadosDespachoSbh = [];
            firmaCalculoCamionesDespachoSbh = '';
            $('#despacho_resumen_capacidad, #despacho_camiones_planificados_seccion').addClass('d-none');
            $('#despacho_camiones_planificados').empty();
            return;
        }
        const cantidadAutomatica = Math.ceil(estado.total / capacidad);
        $('#despacho_resumen_total').text(toneladasNaturalesSbh(estado.total));
        $('#despacho_resumen_formato').text(formato.find('option:selected').text());
        $('#despacho_resumen_ibc').toggleClass('d-none', formato.val() !== 'IBC');
        $('#despacho_resumen_capacidad_valor').text(toneladasNaturalesSbh(capacidad));
        $('#despacho_resumen_camiones').text(cantidadAutomatica);
        $('#despacho_resumen_capacidad').removeClass('d-none');
        sincronizarCamionesPlanificadosSbh(estado.total, capacidad, cantidadAutomatica);
    }

    function formatearValorTarifaSbh(valor, moneda) {
        const numero = Number(valor);
        const monto = Number.isFinite(numero)
            ? numero.toLocaleString('es-CL', { minimumFractionDigits: 0, maximumFractionDigits: 5 })
            : String(valor || '');
        return String(moneda || '').toUpperCase() === 'CLP'
            ? '$' + monto + ' CLP'
            : monto + ' ' + String(moneda || '');
    }

    function textoAlternativaTransporteSbh(alternativa) {
        if (!alternativa) return '';
        return String(alternativa.transportista_nombre || '') + ' | ' +
            String(alternativa.origen || '') + ' → ' + String(alternativa.destino || '') + ' | ' +
            String(alternativa.ruta_nombre || '');
    }

    function buscarAlternativaTransporteSbh(tarifaId) {
        tarifaId = String(tarifaId || '');
        return alternativasTransporteSbh.find(function (alternativa) {
            return String(alternativa.tarifa_id) === tarifaId;
        }) || null;
    }

    function limpiarAlternativaTransporteCamionSbh(camion) {
        camion.empresa_transporte = '';
        camion.empresa_transporte_id = '';
        camion.ruta_id = '';
        camion.tarifa_id = '';
        camion.valor_tarifa = '';
        camion.tarifa_moneda = '';
        camion.alternativa_transporte_texto = '';
    }

    function aplicarAlternativaTransporteCamionSbh(camion, tarifaId) {
        const alternativa = buscarAlternativaTransporteSbh(tarifaId);
        if (!alternativa) {
            limpiarAlternativaTransporteCamionSbh(camion);
            return false;
        }
        camion.empresa_transporte = alternativa.transportista_nombre || '';
        camion.empresa_transporte_id = String(alternativa.transportista_id || '');
        camion.ruta_id = String(alternativa.ruta_id || '');
        camion.tarifa_id = String(alternativa.tarifa_id || '');
        camion.valor_tarifa = String(alternativa.tarifa_valor || '');
        camion.tarifa_moneda = alternativa.tarifa_moneda || '';
        camion.alternativa_transporte_texto = textoAlternativaTransporteSbh(alternativa);
        return true;
    }

    function poblarAlternativasTransporteSbh(control, tarifaSeleccionada) {
        control.empty().append(new Option('', '', false, false));
        alternativasTransporteSbh.forEach(function (alternativa) {
            const seleccionada = String(alternativa.tarifa_id) === String(tarifaSeleccionada || '');
            const option = new Option(
                textoAlternativaTransporteSbh(alternativa),
                String(alternativa.tarifa_id),
                seleccionada,
                seleccionada
            );
            $(option).attr({
                'data-transportista-id': alternativa.transportista_id || '',
                'data-ruta-id': alternativa.ruta_id || '',
                'data-tarifa-id': alternativa.tarifa_id || '',
                'data-valor-tarifa': alternativa.tarifa_valor || '',
                'data-tarifa-moneda': alternativa.tarifa_moneda || ''
            });
            control.append(option);
        });
        if (control.hasClass('select2-hidden-accessible')) control.trigger('change.select2');
    }

    function cargarDireccionesDespachoSbh(clienteCodigo) {
        if (!ES_DESPACHO_SBH_ETAPA0) return;
        clienteCodigo = String(clienteCodigo || '').trim();
        if (!clienteCodigo || clienteCodigo === clienteDireccionesDespachoSbh && direccionesDespachoSbh.length) return;
        clienteDireccionesDespachoSbh = clienteCodigo;
        direccionesDespachoSbh = [];
        alternativasTransporteSbh = [];
        const select = $('#despacho_direccion_sap');
        select.prop('disabled', true).empty().append(new Option('Consultando direcciones SAP...', ''));
        setValue('despacho_destino', '');
        $.ajax({
            url: '{% url "api_despacho_sbh_direcciones" %}',
            type: 'GET',
            data: { cliente_codigo: clienteCodigo, _empresa_id: getValue('empresa_id') },
            success: function (response) {
                direccionesDespachoSbh = response && response.success ? (response.direcciones || []) : [];
                select.empty().append(new Option('Seleccione dirección de despacho', ''));
                direccionesDespachoSbh.forEach(function (direccion) {
                    select.append(new Option(direccion.text, direccion.direccion_codigo));
                });
                select.prop('disabled', false).val('');
                $('#despacho_direccion_sap_ayuda').text(
                    direccionesDespachoSbh.length
                        ? 'Seleccione una dirección; no se asignará automáticamente ninguna tarifa.'
                        : 'El cliente no tiene direcciones de despacho SAP disponibles.'
                );
            },
            error: function (xhr) {
                select.empty().append(new Option('No fue posible consultar direcciones SAP', '')).prop('disabled', true);
                $('#despacho_direccion_sap_ayuda').text(
                    (xhr.responseJSON && xhr.responseJSON.message) || 'No fue posible consultar direcciones SAP.'
                );
            }
        });
    }

    function cargarAlternativasTransporteSbh(direccionCodigo) {
        if (!ES_DESPACHO_SBH_ETAPA0) return;
        direccionCodigo = String(direccionCodigo || '').trim();
        setValue('despacho_destino', direccionCodigo);
        alternativasTransporteSbh = [];
        camionesPlanificadosDespachoSbh.forEach(function (camion) {
            if (camion.condicion_entrega === 'Terramar') limpiarAlternativaTransporteCamionSbh(camion);
        });
        if (!direccionCodigo) {
            if (camionesPlanificadosDespachoSbh.length) recalcularResumenDespachoSbh();
            return;
        }
        $.ajax({
            url: '{% url "api_despacho_sbh_alternativas_transporte" %}',
            type: 'GET',
            data: {
                cliente_codigo: clienteDireccionesDespachoSbh,
                direccion_codigo: direccionCodigo,
                _empresa_id: getValue('empresa_id')
            },
            success: function (response) {
                alternativasTransporteSbh = response && response.success ? (response.alternativas || []) : [];
                if (camionesPlanificadosDespachoSbh.length) {

    function sincronizarCamionesPlanificadosSbh(total, capacidad, cantidadAutomatica) {
        const firma = [total, capacidad, $('#despacho_formato').val() || ''].join('|');

            firmaCalculoCamionesDespachoSbh = firma;
            distribucionCamionesDespachoSbh = 'INICIAL_CAPACIDAD';
            while (camionesPlanificadosDespachoSbh.length > cantidadAutomatica) camionesPlanificadosDespachoSbh.pop();
            while (camionesPlanificadosDespachoSbh.length < cantidadAutomatica) {
                camionesPlanificadosDespachoSbh.push(configuracionInicialCamionSbh());

        actualizarCantidadesCamionesPlanificadosSbh(total, capacidad);

    function distribuirTonelajeSbh(total, capacidad, cantidad, equilibrar) {
        const cantidades = [];
        if (!equilibrar) {
            let restante = total;
            while (restante > 0) {
                const valor = Math.min(capacidad, restante);
                cantidades.push(valor);
                restante -= valor;
            }
            return cantidades;
        }
        if (cantidad * capacidad < total) return Array(cantidad).fill(capacidad);
        const base = Math.floor(total / cantidad);
        let resto = total - (base * cantidad);
        for (let i = 0; i < cantidad; i += 1) {
            const adicional = resto > 0 ? 1 : 0;
            cantidades.push(base + adicional);
            resto -= adicional;
        }
        return cantidades;
    }

    function distribuirAsignacionesSbh(asignaciones, cantidades) {
        const filas = asignaciones.map(function (item) { return toneladasAUnidadesSbh(item.cantidad_intentada_despachar); });
        const total = filas.reduce(function (suma, valor) { return suma + valor; }, 0);
        const matriz = filas.map(function () { return cantidades.map(function () { return 0; }); });
        const residuoFila = filas.slice();
        const residuoColumna = cantidades.slice();
        const fracciones = [];
        filas.forEach(function (fila, i) {
            cantidades.forEach(function (columna, j) {
                const numerador = fila * columna;
                const base = Math.floor(numerador / total);
                matriz[i][j] = base;
                residuoFila[i] -= base;
                residuoColumna[j] -= base;
                fracciones.push({ resto: numerador % total, i: i, j: j });
            });
        });
        fracciones.sort(function (a, b) { return b.resto - a.resto || a.i - b.i || a.j - b.j; });
        while (residuoColumna.reduce(function (suma, valor) { return suma + valor; }, 0) > 0) {
            let progreso = false;
            fracciones.forEach(function (celda) {
                if (residuoFila[celda.i] > 0 && residuoColumna[celda.j] > 0) {
                    matriz[celda.i][celda.j] += 1;
                    residuoFila[celda.i] -= 1;
                    residuoColumna[celda.j] -= 1;
                    progreso = true;
                }
            });
            if (!progreso) throw new Error('No fue posible distribuir las asignaciones SAP.');
        }
        return cantidades.map(function (_, j) {
            const resultado = [];
            asignaciones.forEach(function (original, i) {
                if (matriz[i][j] <= 0) return;
                const copia = JSON.parse(JSON.stringify(original));
                copia.cantidad_intentada_despachar = (matriz[i][j] / ESCALA_TONELADAS_SBH).toFixed(5);
                copia.orden = resultado.length + 1;
                resultado.push(copia);
            });
            return resultado;
        });
    }

    function construirBorradoresDespachoSbh(base, cantidad, equilibrar) {
        const originales = JSON.parse(JSON.stringify(base.asignaciones_planificacion_sap || base.asignaciones_sap));
        const total = originales.reduce(function (suma, item) { return suma + toneladasAUnidadesSbh(item.cantidad_intentada_despachar); }, 0);
        const capacidad = toneladasAUnidadesSbh(base.capacidad_planificacion);
        const cantidades = distribuirTonelajeSbh(total, capacidad, cantidad, equilibrar);
        const asignacionesPorBorrador = distribuirAsignacionesSbh(originales, cantidades);
        return cantidades.map(function (cantidadEstimada, index) {
            const borrador = JSON.parse(JSON.stringify(base));
            borrador.despacho_sbh_etapa0 = true;
            borrador.distribucion_borradores = equilibrar ? 'EQUILIBRADA' : 'INICIAL_CAPACIDAD';
            borrador.numero_borrador = index + 1;
            borrador.total_planificado_despacho = (total / ESCALA_TONELADAS_SBH).toFixed(5);
            borrador.capacidad_planificacion = (capacidad / ESCALA_TONELADAS_SBH).toFixed(5);
            borrador.cantidad_estimada = (cantidadEstimada / ESCALA_TONELADAS_SBH).toFixed(5);
            borrador.cantidad_intentada_despachar = borrador.cantidad_estimada;
            borrador.asignaciones_planificacion_sap = JSON.parse(JSON.stringify(originales));
            borrador.asignaciones_sap = asignacionesPorBorrador[index];
            return borrador;
        });
    }

    function confirmarBorradoresDespachoSbh(citacion) {
        if (citacionesTemporales.some(function (item) { return item.despacho_sbh_etapa0; })) {
            swalFront({ title: 'Planificacion ya generada', text: 'Use Agregar borrador o elimine borradores sobre el lote actual.', icon: 'warning' });
            return;
        }
        const estado = estadoTotalDespachoSbh();
        const capacidad = capacidadDespachoSbh();
        if (!estado.valido || !capacidad) {
            swalFront({ title: 'Calculo incompleto', text: 'Confirme contratos y formato.', icon: 'warning' });
            return;
        }
        if (!validarCamionesPlanificadosSbhModal()) return;
        const cantidad = camionesPlanificadosDespachoSbh.length;
        if (cantidad > 50) {
            swalFront({ title: 'Cantidad no permitida', text: 'El calculo supera el maximo de 50 borradores por planificacion.', icon: 'warning' });
            return;
        }
        citacion.asignaciones_planificacion_sap = JSON.parse(JSON.stringify(citacion.asignaciones_sap));
        citacion.total_planificado_despacho = (estado.total / ESCALA_TONELADAS_SBH).toFixed(5);
        citacion.capacidad_planificacion = (capacidad / ESCALA_TONELADAS_SBH).toFixed(5);
        citacion.ibc_por_camion = citacion.tipo_carga === 'IBC' ? 20 : null;
        const mensaje = 'Esta planificando ' + toneladasNaturalesSbh(estado.total) + ' toneladas de despacho.<br><br>' +
            'Formato: ' + escapeHtml(citacion.tipo_carga_texto) + '<br>' +
            'Capacidad de planificacion: ' + toneladasNaturalesSbh(capacidad) + ' t por camion<br>' +
            'Camiones/citaciones requeridos: ' + cantidad + '.<br><br>' +
            'Se generaran ' + cantidad + ' borradores de citacion para revision.';
        swalFront({
            title: 'Confirmar planificacion de despacho', html: mensaje, icon: 'question',
            showCancelButton: true, cancelButtonText: 'Cancelar', confirmButtonText: 'Continuar'
        }).then(function (resultado) {
            if (!(resultado && (resultado.isConfirmed || resultado.value))) return;
            citacionesTemporales = construirBorradoresDespachoSbh(
                citacion, cantidad, distribucionCamionesDespachoSbh === 'EQUILIBRADA'
            );
            citacionesTemporales.forEach(function (borrador, index) {
                Object.assign(borrador, configuracionTransporteBorradorSbh(camionesPlanificadosDespachoSbh[index]));
            });
            renderizarCitacionesTemporales();
            cerrarModalEtapa0YMostrarResumen('#ModalCrearDespacho');
            swalFront({ title: 'Borradores generados', text: 'Se generaron ' + cantidad + ' borradores para revision.', icon: 'success' });
            limpiarFormularioDespacho();
        });
    }

            transportado_por: item.transportado_por || '', empresa_transporte: item.empresa_transporte || '',

    function redistribuirBorradoresDespachoSbh(cantidad) {
        if (!citacionesTemporales.length || !citacionesTemporales[0].despacho_sbh_etapa0 || cantidad <= 0) return;
        const configuraciones = citacionesTemporales.map(configuracionTransporteBorradorSbh);

    function guardarTransporteBorradorSbh() {
        const index = Number($('#borrador_sbh_indice').val());
        const item = citacionesTemporales[index];
        if (!item) return;
        const condicion = $('#borrador_sbh_condicion').val();
        const terramar = condicion === 'Terramar';
        const alternativa = terramar ? buscarAlternativaTransporteSbh($('#borrador_sbh_tarifa_id').val()) : null;
        const empresa = normalizarTextoDespachoManual(terramar && alternativa ? alternativa.transportista_nombre : $('#borrador_sbh_empresa_transporte_manual').val());
        const empresaId = terramar && alternativa ? String(alternativa.transportista_id) : '';
        if (terramar && !alternativa) {
            swalFront({ title: 'Atenci\u00f3n', text: 'Debe seleccionar una alternativa de Transporte / Ruta / Tarifa v\u00e1lida para el borrador ' + (index + 1) + '.', icon: 'warning' });
            return;
        }
        const conductor = normalizarTextoDespachoManual(terramar ? ($('#borrador_sbh_conductor').val() || '') : $('#borrador_sbh_conductor_manual').val());
        Object.assign(item, {
            condicion_entrega: condicion, transportado_por: condicion, inf_24hrs: condicion,
            empresa_transporte: empresa, empresa_transporte_manual: terramar ? '' : empresa, empresa_transporte_id: empresaId,
            ruta_id: alternativa ? String(alternativa.ruta_id) : '',
            tarifa_id: alternativa ? String(alternativa.tarifa_id) : '',
            valor_tarifa: alternativa ? String(alternativa.tarifa_valor) : '',
            tarifa_moneda: alternativa ? alternativa.tarifa_moneda : '',
            alternativa_transporte_texto: alternativa ? textoAlternativaTransporteSbh(alternativa) : empresa,
            conductor: conductor, conductor_manual: terramar ? '' : conductor,
            conductor_id: terramar ? $('#borrador_sbh_conductor_id').val() : '',
            patente: normalizarTextoDespachoManual($('#borrador_sbh_patente').val()).toUpperCase(),
            ingreso_manual_transporte: !terramar
        });
        renderizarCitacionesTemporales();
        $('#ModalEditarTransporteBorradorSbh').modal('hide');
    }

    function renderizarCitacionesTemporales() {
        const tbody = document.getElementById('tbody_citaciones_temporales');
        const contador = document.getElementById('contador_citaciones_temporales');
        const resumen = document.getElementById('resumen_citaciones_agregadas');
        const columnas = ES_RECEPCION_TRANSFERENCIA_SBH ? 7 : (ES_RECEPCION_TERRAMAR ? 16 : (ES_DESPACHO_TERRAMAR ? 22 : (ES_DESPACHO_SBH_ETAPA0 ? 8 : (MOSTRAR_BL_PLANIFICACION ? 14 : 13))));

        if (!tbody) return;
        tbody.innerHTML = '';

        if (contador) contador.innerText = citacionesTemporales.length;
        if (resumen) resumen.innerText = citacionesTemporales.length;
        $('#agregar_borrador_despacho_sbh').toggleClass('d-none', !(ES_DESPACHO_SBH_ETAPA0 && citacionesTemporales.length));
        const borradoresSbh = ES_DESPACHO_SBH_ETAPA0 ? citacionesTemporales.filter(function (item) { return item.despacho_sbh_etapa0; }) : [];
        if (borradoresSbh.length) {
            const total = toneladasAUnidadesSbh(borradoresSbh[0].total_planificado_despacho);
            const capacidad = toneladasAUnidadesSbh(borradoresSbh[0].capacidad_planificacion) * borradoresSbh.length;
            $('#advertencia_capacidad_despacho_sbh')
                .toggleClass('d-none', capacidad >= total)
                .html('La capacidad estimada de las citaciones restantes (' + toneladasNaturalesSbh(capacidad) + ' t) es inferior a las ' + toneladasNaturalesSbh(total) + ' t planificadas.');
        } else {
            $('#advertencia_capacidad_despacho_sbh').addClass('d-none').text('');
        }

        if (citacionesTemporales.length === 0) {
            tbody.innerHTML = `<tr id="fila_sin_citaciones"><td colspan="${columnas}" class="text-center text-muted">Aún no existen citaciones agregadas.</td></tr>`;
            return;
        }

        citacionesTemporales.forEach(function (item, index) {
            const tr = document.createElement('tr');
            tr.innerHTML = ES_RECEPCION_TRANSFERENCIA_SBH
                ? renderizarFilaRecepcionTransferencia(item, index)
                : (ES_RECEPCION_TERRAMAR
                    ? renderizarFilaRecepcionTerramar(item, index)
                    : (ES_DESPACHO_TERRAMAR
                        ? renderizarFilaDespachoTerramar(item, index)
                        : (ES_DESPACHO_SBH_ETAPA0 ? renderizarFilaDespachoSbh(item, index) : renderizarFilaLegacy(item, index))));
            tbody.appendChild(tr);
        });
    }

        citacionesTemporales.splice(index, 1);
        if (eraBorradorSbh && citacionesTemporales.length) {
            redistribuirBorradoresDespachoSbh(citacionesTemporales.length);
        }
        renderizarCitacionesTemporales();
    }

    function controlarSobrecupoPlanificacion() {
        const selectSobrecupo = document.getElementById('es_sobrecupo_planificacion');
        const inputCantidad = document.getElementById('cantidad_sobrecupo_planificacion');

        if (!selectSobrecupo || !inputCantidad) {
            return;
        }

        if (selectSobrecupo.value === 'Si') {
            inputCantidad.disabled = false;
            inputCantidad.readOnly = false;
            inputCantidad.removeAttribute('readonly');
            inputCantidad.removeAttribute('disabled');

            if (inputCantidad.value === '' || parseInt(inputCantidad.value) <= 0) {
                inputCantidad.value = 1;
            }

            inputCantidad.classList.remove('bg-light');
        } else {
            inputCantidad.value = 0;
            inputCantidad.disabled = true;
            inputCantidad.readOnly = true;
            inputCantidad.setAttribute('readonly', true);
            inputCantidad.setAttribute('disabled', true);
            inputCantidad.classList.add('bg-light');
        }
    }

    function validarTransportesBorradoresSbhFrontend() {
        if (!ES_DESPACHO_SBH_ETAPA0) return true;
        for (let index = 0; index < citacionesTemporales.length; index += 1) {
            const item = citacionesTemporales[index];
            const condicion = item.condicion_entrega || item.transportado_por || '';
            if (condicion !== 'Terramar' && condicion !== 'Cliente') {
                swalFront({ title: 'Atenci\u00f3n', text: 'Debe definir la Condici\u00f3n de entrega del borrador ' + (index + 1) + '.', icon: 'warning' });
                return false;
            }
            if (condicion === 'Terramar' && (!String(item.empresa_transporte_id || '').trim() || !String(item.ruta_id || '').trim() || !String(item.tarifa_id || '').trim())) {
                swalFront({ title: 'Atenci\u00f3n', text: 'Debe seleccionar una alternativa de Transporte / Ruta / Tarifa para el borrador ' + (index + 1) + '.', icon: 'warning' });
                return false;
            }
        }
        return true;
    }

    function guardarPlanificacionConCitaciones() {
        if (citacionesTemporales.length === 0) {
            swalFront({
                title: 'Atención',
                text: 'Debe agregar al menos una citación antes de guardar la planificación.',
                icon: 'warning'
            });
            return;
        }
        if (!validarTransportesBorradoresSbhFrontend()) return;

        const esSobrecupo = getValue('es_sobrecupo_planificacion') || 'No';
        const cantidadSobrecupo = getValue('cantidad_sobrecupo_planificacion') || '0';

        const formData = new FormData();

        formData.append('citaciones_json', JSON.stringify(citacionesTemporales));
        formData.append('cantidad_repetir', citacionesTemporales.length);
        if (PLANIFICACION_EXISTENTE_ID) formData.append('planificacion_existente_id', PLANIFICACION_EXISTENTE_ID);
        if (ES_DESPACHO_SBH_ETAPA0) formData.append('despacho_sbh_etapa0', '1');
        formData.append('es_sobrecupo', esSobrecupo);
        formData.append('cantidad_sobrecupo', cantidadSobrecupo);
        if (FLUJO_NAVEGACION) {
            formData.append('flujo', FLUJO_NAVEGACION);
        }
        if (SOLICITUD_NO_PLANIFICADO_ID) {
            formData.append('solicitud_no_planificado_id', SOLICITUD_NO_PLANIFICADO_ID);
        }

        $.ajax({
            url: '/crear-planificacion-citacion/',
            type: 'POST',
            data: formData,
            processData: false,
            contentType: false,
            headers: {
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            success: function (response) {
                console.log('Respuesta guardar planificación:', response);

                if (!response.success) {
                    swalFront({
                        title: 'Error',
                        text: response.message || 'No fue posible crear la planificación.',
                        icon: 'error'
                    });
                    return;
                }

                swalFront({
                    title: 'Planificación creada',
                    text: response.message || 'La planificación y sus citaciones fueron creadas correctamente.',
                    icon: 'success',
                    confirmButtonText: 'Aceptar'
                }).then(function () {
                    window.location.href = PLANIFICACION_EXISTENTE_ID
                        ? '/pla_listone/' + PLANIFICACION_EXISTENTE_ID + '?_empresa_id={{ empresa_id }}'
                        : URL_LISTADO_PLANIFICACION;
                });
            },
            error: function (xhr) {
                console.error('Error guardar planificación:', xhr.responseText);

                swalFront({
                    title: 'Error',
                    text: mensajeErrorPlanificacion(xhr, 'No fue posible guardar la planificacion.'),
                    icon: 'error'
                });
            }
        });
    }

    function validarFormularioCitacion() {
        const form = document.getElementById('form_crear_citacion');

        if (!form) {
            swalFront({
                title: 'Error',
                text: 'No se encontró el formulario de creación.',
                icon: 'error'
            });
            return false;
        }


        if (esProsesaPiso2Seleccionado()) {
            if (!getValue('fecha_llegada').trim()) {
                swalFront({ title: 'Atención', text: 'Debe ingresar fecha de llegada.', icon: 'warning' });
                return false;
            }
            if (!getValue('guia_origen_prosesa').trim()) {
                swalFront({
                    title: 'Atención',
                    text: 'Debe ingresar la guía de la Citación Prosesa Piso 1.',
                    icon: 'warning'
                });
                return false;
            }
            if (!origenProsesaPiso2Cargado
                || origenProsesaPiso2Cargado.guia !== getValue('guia_origen_prosesa').trim()) {
                swalFront({
                    title: 'Atencion',
                    text: 'Cargue los datos desde Piso 1 antes de agregar la citacion.',
                    icon: 'warning'
                });
                return false;
            }
            const patenteRetiro = normalizarPatenteRetiroProsesa(
                getValue('prosesa_piso2_patente_retiro')
            );
            setValue('prosesa_piso2_patente_retiro', patenteRetiro);
            return true;
        }

        if (!form.checkValidity()) {
            form.reportValidity();
            return false;
        }

        if (!getValue('codigo').trim()) {
            swalFront({
                title: 'Atención',
                text: 'Debe ingresar y buscar un código SAP.',
                icon: 'warning'
            });
            return false;
        }

        if (!getValue('insumo').trim()) {
            swalFront({
                title: 'Atención',
                text: 'Debe buscar un código SAP válido para cargar el insumo.',
                icon: 'warning'
            });
            return false;
        }

        if (!getValue('pedido').trim()) {
            swalFront({
                title: 'Atención',
                text: 'Debe ingresar y buscar el Pedido SAP.',
                icon: 'warning'
            });
            return false;
        }

        if (!getValue('sap_opor_id').trim()) {
            swalFront({
                title: 'Atención',
                text: 'Debe buscar un Pedido SAP válido antes de crear la citación.',
                icon: 'warning'
            });
            return false;
        }

        if (!getValue('cantidad_disponible').trim()) {
            swalFront({
                title: 'Atención',
                text: 'El Pedido SAP debe tener cantidad disponible asociada.',
                icon: 'warning'
            });
            return false;
        }

        const saldoDisponibleSap = Number(getValue('cantidad_disponible').trim().replace(',', '.'));
        if (!Number.isFinite(saldoDisponibleSap) || saldoDisponibleSap <= 0) {
            swalFront({
                title: 'Atención',
                text: 'Este pedido/línea SAP no tiene cantidad disponible para planificar.',
                icon: 'warning'
            });
            return false;
        }
        if (!$('#cliente').val()) {
            swalFront({
                title: 'Atención',
                text: 'Debe seleccionar un cliente.',
                icon: 'warning'
            });
            return false;
        }

        if (!$('#proveedor').val()) {
            swalFront({
                title: 'Atención',
                text: 'Debe seleccionar un proveedor.',
                icon: 'warning'
            });
            return false;
        }

        if (!$('#secuencia_id').val()) {
            swalFront({
                title: 'Atencion',
                text: 'Debe seleccionar una secuencia operacional.',
                icon: 'warning'
            });
            return false;
        }

        return true;
    }

    function validarFormularioDespacho() {
        const form = document.getElementById('form_crear_despacho');

        if (!form) {
            swalFront({
                title: 'Error',
                text: 'No se encontró el formulario de despacho.',
                icon: 'error'
            });
            return false;
        }

        if (!form.checkValidity()) {
            form.reportValidity();
            return false;
        }

        if (ES_DESPACHO_SBH_ETAPA0) {
            const fechaDespacho = getValue('despacho_fecha');
            const fechaLlegadaDestino = getValue('despacho_fecha_llegada_destino');
            if (fechaLlegadaDestino < fechaDespacho) {
                swalFront({
                    title: 'Fecha de llegada inválida',
                    text: 'La fecha de llegada al destino no puede ser anterior a la fecha de despacho.',
                    icon: 'warning'
                });
                return false;
            }
        }

        if (!$('#despacho_cliente').val()) {
            swalFront({
                title: 'Atención',
                text: 'Debe seleccionar un cliente.',
                icon: 'warning'
            });
            return false;
        }

        if (!$('#despacho_secuencia_id').val()) {
            swalFront({
                title: 'Atención',
                text: 'Debe seleccionar una secuencia operacional.',
                icon: 'warning'
            });
            return false;
        }

        if (!$('#despacho_salida_documento').val()) {
            swalFront({
                title: 'Atencion',
                text: 'Debe seleccionar Salida de documento.',
                icon: 'warning'
            });
            return false;
        }

        if (ES_DESPACHO_SBH_ETAPA0 && !String($('#despacho_direccion_sap').val() || '').trim()) {
            swalFront({
                title: 'Atención',
                text: 'Debe seleccionar una dirección de despacho SAP.',
                icon: 'warning'
            });
            return false;
        }

        const condicionEntrega = condicionEntregaDespacho();
        const transporteTerramar = despachoTransporteTerramarActivo();

        if (!ES_DESPACHO_SBH_ETAPA0 && !condicionEntrega) {
            swalFront({
                title: 'Atencion',
                text: 'Debe seleccionar Condicion de entrega.',
                icon: 'warning'
            });
            return false;
        }

        if (!ES_DESPACHO_SBH_ETAPA0 && transporteTerramar && !empresaTransporteDespachoValor()) {
            swalFront({
                title: 'Atencion',
                text: 'Debe seleccionar una empresa transporte.',
                icon: 'warning'
            });
            return false;
        }

        if (!ES_DESPACHO_SBH_ETAPA0 && transporteTerramar && !conductorDespachoValor()) {
            swalFront({
                title: 'Atencion',
                text: 'Debe seleccionar un conductor.',
                icon: 'warning'
            });
            return false;
        }

        if (!ES_DESPACHO_SBH_ETAPA0 && transporteTerramar && !getValue('despacho_patente').trim()) {
            swalFront({
                title: 'Atencion',
                text: 'Debe ingresar una patente.',
                icon: 'warning'
            });
            return false;
        }

        if (!validarAsignacionesSapDespacho()) return false;
        if (!validarCamionesPlanificadosSbhModal()) return false;

        return true;
    }

    function limpiarFormularioCitacion() {
        const form = document.getElementById('form_crear_citacion');

        if (form) {
            form.reset();
        }

        limpiarDatosProducto(true);

        if ($('#cliente').length) {
            $('#cliente').val('').trigger('change');
        }

        if ($('#proveedor').length) {
            $('#proveedor').val('').trigger('change');
        }

        if ($('#secuencia_id').length) {
            $('#secuencia_id').val('').trigger('change');
        }
        if (ES_INGRESO_MERCADERIA_SBH && $('#flujo_operacional_visual').length) {
            $('#flujo_operacional_visual').val('').trigger('change');
        }

        setValue('status', 'Insumo Programado');
        setValue('guia_origen_prosesa', '');
        setValue('prosesa_piso2_patente_retiro', '');
        $('#prosesa_piso2_empresa_transporte').val(null).trigger('change.select2');
        setValue('prosesa_piso2_empresa_transporte_id', '');
        invalidarDatosProsesaPiso2();
        actualizarModoProsesa();
        setValue('status_display', 'Insumo Programado');

        const cantidadRepetir = document.getElementById('cantidad_repetir');

        if (cantidadRepetir) {
            cantidadRepetir.value = 1;
        }

        $('#tipo').prop('disabled', Boolean(TIPO_PLANIFICACION_BLOQUEADO));
    }

    function limpiarFormularioDespacho() {
        const form = document.getElementById('form_crear_despacho');

        if (form) {
            form.reset();
        }

        [
            '#despacho_cliente',
            '#despacho_formato',
            '#despacho_empresa_transporte',
            '#despacho_conductor',
            '#despacho_transportado_por',
            '#despacho_salida_documento',
            '#despacho_secuencia_id',
            '#despacho_sap_busqueda'
        ].forEach(function (selector) {
            if ($(selector).length) {
                $(selector).val('').trigger('change');
            }
        });

        $('#despacho_ingreso_manual').prop('checked', false);
        $('#despacho_empresa_transporte_id').val('');
        $('#despacho_conductor_id').val('');
        setValue('despacho_empresa_transporte_manual', '');
        setValue('despacho_conductor_manual', '');
        setValue('despacho_patente', '');
        $('#despacho_conductor_mensaje').data('visible-auto', false).addClass('d-none');
        actualizarModoDespachoTransporte();
        limpiarDatosSapDespacho(false);
        if (ES_DESPACHO_SBH_ETAPA0) {
            camionesPlanificadosDespachoSbh = [];
            firmaCalculoCamionesDespachoSbh = '';
            distribucionCamionesDespachoSbh = 'INICIAL_CAPACIDAD';
            recalcularResumenDespachoSbh();
        }
    }

    function limpiarDatosPedido(limpiarPedido = false) {
        const campos = [
            'sap_opor_id',
            'cantidad_disponible',
            'docentry',
            'line_num',
            'contrato_sap',
            'codigo_proveedor_sap',
            'bl',
            'contenedor',
            'guia',
            'fecha_produccion',
            'fecha_vencimiento',
            'cda',
            'di',
            'sui',
            'nave_naviera',
            'booking'
        ];

        if (limpiarPedido) {
            campos.push('pedido');
        }

        campos.forEach(function (id) {
            setValue(id, '');
        });
        actualizarBlRecepcionSbh('');
        $('#saldo_sap_mensaje').addClass('d-none');
        $('#crear_citacion_temporal').prop('disabled', false);

        if (limpiarPedido && $('#pedido').length) {
            pedidosProductoActual = [];
            lineasPedidoActual = [];
            bloqueandoCambioPedido = true;
            $('#pedido').empty().append(new Option('', '', false, false)).val('').trigger('change.select2');
            bloqueandoCambioPedido = false;
        }

        setValue('proveedor_codigo', $('#proveedor').val() || '');
    }

    function limpiarDatosProducto(limpiarCodigo = true) {
        const campos = [
            'sap_opor_id',
            'insumo',
            'proveedor_codigo',
            'codigo_proveedor_sap',
            'contrato_sap',
            'pedido',
            'cantidad_disponible',
            'docentry',
            'line_num',
            'bl',
            'contenedor',
            'guia',
            'fecha_produccion',
            'fecha_vencimiento',
            'cda',
            'di',
            'sui',
            'nave_naviera',
            'booking'
        ];

        if (limpiarCodigo) {
            campos.push('codigo');
        }

        campos.forEach(function (id) {
            setValue(id, '');
        });
        actualizarBlRecepcionSbh('');
        $('#saldo_sap_mensaje').addClass('d-none');
        $('#crear_citacion_temporal').prop('disabled', false);

        if ($('#insumo').length) {
            bloquearLimpiezaProducto = true;
            $('#insumo').val('').trigger('change');
            bloquearLimpiezaProducto = false;
        }

        if ($('#proveedor').length) {
            $('#proveedor').val('').trigger('change');
        }

        pedidosProductoActual = [];
        lineasPedidoActual = [];
    }
</script>
