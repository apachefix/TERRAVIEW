<script>
    const TIPO_PLANIFICACION_BLOQUEADO = '{{ tipo_planificacion|default:"" }}';
    const FLUJO_NAVEGACION = '{{ flujo_navegacion|default:"" }}';
    const PLANIFICACION_EXISTENTE_ID = '{{ planificacion_existente_id|default:"" }}';
    const URL_LISTADO_PLANIFICACION = '{% url "pla_listall" %}?tipo={{ tipo_planificacion }}{% if flujo_navegacion %}&flujo={{ flujo_navegacion }}{% endif %}&_empresa_id={{ empresa_id }}';
    const SOLICITUD_NO_PLANIFICADO_ID = '{{ solicitud_no_planificado_id|default:"" }}';
    const CAMION_PATIO_INICIAL = JSON.parse(document.getElementById('camion-patio-inicial-data').textContent || '{}');
    const MOSTRAR_BL_PLANIFICACION = TIPO_PLANIFICACION_BLOQUEADO !== 'DESPACHO';
    const ES_RECEPCION_TERRAMAR = {% if es_recepcion_terramar %}true{% else %}false{% endif %};
    const ES_RECEPCION_SBH = {% if es_recepcion_sbh %}true{% else %}false{% endif %};
    const ES_INGRESO_MERCADERIA_SBH = {% if es_ingreso_mercaderia_sbh %}true{% else %}false{% endif %};
    const CODIGO_PROSESA_PISO_1 = 'RECEPCION_PROSESA_PISO_1';
    const CODIGO_PROSESA_PISO_2 = 'RECEPCION_PROSESA_PISO_2';
    const CODIGO_PROSESA_DESCARGA_CAMION = 'RECEPCION_BODEGA_EXTERNA';
    const CODIGOS_MODALIDAD_PROSESA = [
        CODIGO_PROSESA_DESCARGA_CAMION, CODIGO_PROSESA_PISO_1, CODIGO_PROSESA_PISO_2
    ];
    const CODIGO_NEW_JERSEY_P1_CON_CALIDAD = 'RECEPCION_NEW_JERSEY_P1_CON_CALIDAD';
    const CODIGO_NEW_JERSEY_P1_SIN_CALIDAD = 'RECEPCION_NEW_JERSEY_P1_SIN_CALIDAD';
    const CODIGOS_MODALIDAD_NEW_JERSEY = [
        CODIGO_NEW_JERSEY_P1_CON_CALIDAD, CODIGO_NEW_JERSEY_P1_SIN_CALIDAD
    ];
    const CODIGOS_SECUENCIA_RECEPCION = {{ secuencias_json|default:"{}"|safe }};
    const ESTANQUES_RECEPCION_SBH = {{ estanques_por_almacen_json|default:"{}"|safe }};
    const ES_RECEPCION_TRANSFERENCIA_SBH = {% if es_recepcion_transferencia_sbh %}true{% else %}false{% endif %};
    const ESTANQUES_ORIGEN_TRANSFERENCIA = [{% for estanque in estanques_recepcion_transferencia_sbh %}'{{ estanque|escapejs }}'{% if not forloop.last %}, {% endif %}{% endfor %}];
    const ES_DESPACHO_TERRAMAR = {% if es_despacho_terramar %}true{% else %}false{% endif %};
    const ES_DESPACHO_SBH_ETAPA0 = {% if empresa_id == 2 and tipo_planificacion == 'DESPACHO' %}true{% else %}false{% endif %};
    const FORMATOS_DESPACHO_PERMITIDOS = ['Cisterna', 'Contenedor', 'Isotank', 'IBC'];
    const CAPACIDAD_FORMATO_DESPACHO_SBH = { Cisterna: 27.5, Contenedor: 21.6, Isotank: 23.4 };
    const ESCALA_TONELADAS_SBH = 100000;

    let citacionesTemporales = [];
    let origenProsesaPiso2Cargado = null;
    let opcionesSecuenciaOriginales = [];
    let clientesSapCargados = false;
    let productosSapCargados = false;
    let bloquearLimpiezaProducto = false;
    let pedidosProductoActual = [];
    let lineasPedidoActual = [];
    let bloqueandoCambioPedido = false;
    let despachoSapSeleccionado = null;
    let asignacionesSapPlanificadas = [];
    let vistasPreviasSapDespacho = {};
    let stockFisicoSapPorAsignacion = {};
    let stockFisicoSapCache = {};
    let direccionesDespachoSbh = [];
    let alternativasTransporteSbh = [];
    let clienteDireccionesDespachoSbh = '';
    let contadorAsignacionesSap = 1;
    let camionesPlanificadosDespachoSbh = [];
    let firmaCalculoCamionesDespachoSbh = '';
    let distribucionCamionesDespachoSbh = 'INICIAL_CAPACIDAD';

    function cerrarModalEtapa0YMostrarResumen(selectorModal) {
        const modal = $(selectorModal);
        const resumen = $('#ModalResumenCitacionesEtapa0');

        if (!resumen.length) {
            modal.modal('hide');
            return;
        }

        modal
            .off('hidden.bs.modal.etapa0Resumen')
            .one('hidden.bs.modal.etapa0Resumen', function () {
                resumen.modal('show');
            })
            .modal('hide');
    }

    function poblarEstanquesRecepcionSbh() {
        if (!ES_RECEPCION_SBH) return;

        const almacen = $('#recepcion_sbh_almacen_destino').val() || '';
        const estanque = $('#recepcion_sbh_estanque_destino');
        const estanques = ESTANQUES_RECEPCION_SBH[almacen] || [];

        estanque.empty().append(new Option('Seleccione estanque', '')).prop('disabled', !almacen);
        estanques.forEach(function (codigo) {
            estanque.append(new Option(codigo, codigo));
        });
    }

    function poblarEstanquesDestinoTransferencia() {
        if (!ES_RECEPCION_TRANSFERENCIA_SBH) return;

        const almacen = $('#transferencia_almacen_destino').val() || '';
        const estanque = $('#transferencia_estanque_destino');
        const estanques = ESTANQUES_RECEPCION_SBH[almacen] || [];

        estanque.empty().append(new Option(
            almacen ? 'Seleccione estanque' : 'Seleccione primero un almacén', ''
        )).prop('disabled', !almacen);
        estanques.forEach(function (codigo) {
            estanque.append(new Option(codigo, codigo));
        });
    }


    function codigoSecuenciaRecepcionSeleccionada() {
        return String(CODIGOS_SECUENCIA_RECEPCION[$('#secuencia_id').val()] || '').toUpperCase();
    }

    function esProsesaPiso2Seleccionado() {
        return ES_INGRESO_MERCADERIA_SBH
            && codigoSecuenciaRecepcionSeleccionada() === CODIGO_PROSESA_PISO_2;
    }

    function etiquetaFlujoRecepcionProsesa(opcion) {
        let texto = String($(opcion).text() || '').trim();
        texto = texto.replace(/^RECEPCI(?:\u00d3|O)N\s*-\s*/i, '').trim();
        return 'Recepci\u00f3n - ' + texto;
    }

    function sincronizarSecuenciaDesdeSelectorVisual() {
        if (!ES_INGRESO_MERCADERIA_SBH) return;

        const selectorPrincipal = $('#flujo_operacional_visual');
        const selectorModalidad = $('#modalidad_prosesa');
        const selectorModalidadNewJersey = $('#modalidad_new_jersey');
        const esProsesa = selectorPrincipal.val() === 'PROSESA';
        const esNewJersey = selectorPrincipal.val() === 'NEW_JERSEY';
        $('#prosesa_modalidad_bloque').toggleClass('d-none', !esProsesa);
        $('#new_jersey_modalidad_bloque').toggleClass('d-none', !esNewJersey);
        selectorModalidad.prop('required', esProsesa);
        selectorModalidadNewJersey.prop('required', esNewJersey);

        if (!esProsesa) {
            selectorModalidad.val('').trigger('change.select2');
        }
        if (!esNewJersey) {
            selectorModalidadNewJersey.val('').trigger('change.select2');
        }

        const secuenciaId = esProsesa
            ? selectorModalidad.val()
            : (esNewJersey ? selectorModalidadNewJersey.val() : selectorPrincipal.val());
        $('#secuencia_id').val(secuenciaId || '').trigger('change');
    }

    function inicializarSelectoresVisualesProsesa() {
        if (!ES_INGRESO_MERCADERIA_SBH) return;

        const selectorPrincipal = $('#flujo_operacional_visual');
        const selectorModalidad = $('#modalidad_prosesa');
        const selectorModalidadNewJersey = $('#modalidad_new_jersey');
        const secuenciaReal = $('#secuencia_id');
        if (!selectorPrincipal.length || !selectorModalidad.length || !selectorModalidadNewJersey.length || !secuenciaReal.length) return;

        const secuenciaSeleccionada = String(secuenciaReal.val() || '');
        const codigoSeleccionado = String(CODIGOS_SECUENCIA_RECEPCION[secuenciaSeleccionada] || '').toUpperCase();
        const tipoSeleccionado = String($('#tipo').val() || '').toUpperCase();
        const etiquetasModalidad = {};
        etiquetasModalidad[CODIGO_PROSESA_DESCARGA_CAMION] = 'Descarga sobre cami\u00f3n';
        etiquetasModalidad[CODIGO_PROSESA_PISO_1] = 'Contenedor a Piso 1';
        etiquetasModalidad[CODIGO_PROSESA_PISO_2] = 'Contenedor a Piso 2';
        const etiquetasModalidadNewJersey = {};
        etiquetasModalidadNewJersey[CODIGO_NEW_JERSEY_P1_CON_CALIDAD] = 'Contenedor a Piso con Calidad';
        etiquetasModalidadNewJersey[CODIGO_NEW_JERSEY_P1_SIN_CALIDAD] = 'Contenedor a Piso sin Calidad';

        selectorPrincipal.empty().append(new Option('Seleccione flujo operacional', ''));
        selectorModalidad.empty().append(new Option('Seleccione modalidad', ''));
        selectorModalidadNewJersey.empty().append(new Option('Seleccione modalidad', ''));

        opcionesSecuenciaOriginales.each(function () {
            const opcion = $(this);
            const tipoOpcion = String(opcion.data('tipo') || '').toUpperCase();
            const codigo = String(CODIGOS_SECUENCIA_RECEPCION[opcion.val()] || '').toUpperCase();
            if (
                (tipoSeleccionado && tipoOpcion !== tipoSeleccionado)
                || CODIGOS_MODALIDAD_PROSESA.includes(codigo)
                || CODIGOS_MODALIDAD_NEW_JERSEY.includes(codigo)
            ) {
                return;
            }
            selectorPrincipal.append(new Option(etiquetaFlujoRecepcionProsesa(this), opcion.val()));
        });

        CODIGOS_MODALIDAD_PROSESA.forEach(function (codigo) {
            const opcion = opcionesSecuenciaOriginales.filter(function () {
                return String(CODIGOS_SECUENCIA_RECEPCION[$(this).val()] || '').toUpperCase() === codigo;
            }).first();
            if (opcion.length) {
                selectorModalidad.append(new Option(etiquetasModalidad[codigo], opcion.val()));
            }
        });

        if (selectorModalidad.find('option').length > 1) {
            selectorPrincipal.append(new Option('Recepci\u00f3n - Prosesa', 'PROSESA'));
        }
        CODIGOS_MODALIDAD_NEW_JERSEY.forEach(function (codigo) {
            const opcion = opcionesSecuenciaOriginales.filter(function () {
                return String(CODIGOS_SECUENCIA_RECEPCION[$(this).val()] || '').toUpperCase() === codigo;
            }).first();
            if (opcion.length) {
                selectorModalidadNewJersey.append(new Option(etiquetasModalidadNewJersey[codigo], opcion.val()));
            }
        });
        if (selectorModalidadNewJersey.find('option').length > 1) {
            selectorPrincipal.append(new Option('Recepci\u00f3n - Sector New Jersey', 'NEW_JERSEY'));
        }

        if (CODIGOS_MODALIDAD_PROSESA.includes(codigoSeleccionado)) {
            selectorPrincipal.val('PROSESA');
            selectorModalidad.val(secuenciaSeleccionada);
            selectorModalidadNewJersey.val('');
        } else if (CODIGOS_MODALIDAD_NEW_JERSEY.includes(codigoSeleccionado)) {
            selectorPrincipal.val('NEW_JERSEY');
            selectorModalidad.val('');
            selectorModalidadNewJersey.val(secuenciaSeleccionada);
        } else {
            selectorPrincipal.val(secuenciaSeleccionada);
            selectorModalidad.val('');
            selectorModalidadNewJersey.val('');
        }

        [selectorPrincipal, selectorModalidad, selectorModalidadNewJersey].forEach(function (selector) {
            if (selector.hasClass('select2-hidden-accessible')) selector.select2('destroy');
            selector.select2({
                placeholder: 'Seleccione',
                allowClear: true,
                width: '100%',
                dropdownParent: $('#ModalCrearCitacion')
            });
        });

        selectorPrincipal.off('change.prosesaVisual').on('change.prosesaVisual', sincronizarSecuenciaDesdeSelectorVisual);
        selectorModalidad.off('change.prosesaVisual').on('change.prosesaVisual', sincronizarSecuenciaDesdeSelectorVisual);
        selectorModalidadNewJersey.off('change.newJerseyVisual').on('change.newJerseyVisual', sincronizarSecuenciaDesdeSelectorVisual);
        sincronizarSecuenciaDesdeSelectorVisual();
    }

    function invalidarDatosProsesaPiso2() {
        if (origenProsesaPiso2Cargado) {
            [
                'codigo', 'sap_opor_id', 'cantidad_disponible', 'docentry',
                'proveedor_codigo', 'codigo_proveedor_sap', 'contenedor', 'bl',
                'guia', 'fecha_produccion', 'fecha_vencimiento', 'cda', 'di',
                'sui', 'nave_naviera', 'booking', 'inf_24hrs', 'observacion'
            ].forEach(function (id) { setValue(id, ''); });
            ['cliente', 'insumo', 'pedido', 'proveedor'].forEach(function (id) {
                const control = $('#' + id);
                control.find('option[data-prosesa-origen="1"]').remove();
                control.val('').trigger('change.select2');
            });
            $('#recepcion_sbh_almacen_destino').val('').trigger('change');
            $('#tipo_origen_recepcion').val('');
            $('#tipo_carga').val('').trigger('change.select2');
        }
        origenProsesaPiso2Cargado = null;
        $('#prosesa_piso2_resultado').addClass('d-none').empty();
    }

    function seleccionarDatoProsesaPiso2(id, valor, texto, itemname) {
        const control = $('#' + id);
        control.find('option[data-prosesa-origen="1"]').remove();
        if (valor) {
            const opcion = new Option(texto || String(valor), String(valor), true, true);
            $(opcion).attr('data-prosesa-origen', '1');
            if (itemname) $(opcion).attr('data-itemname', itemname);
            control.append(opcion);
        } else {
            control.val('');
        }
        control.trigger('change.select2');
    }

    function mostrarSnapshotProsesaPiso2(origenId, datos) {
        const campos = [
            ['Citaci\u00f3n Piso 1', '#' + origenId],
            ['Cliente', datos.cliente_nombre],
            ['Tipo de carga', datos.tipo_carga],
            ['Informaci\u00f3n 24 horas', datos.inf_24hrs],
            ['ItemCode / C\u00f3digo SAP', datos.codigo_sap],
            ['Insumo / producto', datos.insumo],
            ['Proveedor', datos.proveedor_nombre || datos.proveedor_sap],
            ['C\u00f3digo proveedor SAP', datos.codigo_proveedor_sap],
            ['Pedido SAP', datos.pedido],
            ['BaseEntry / DocEntry', datos.docentry || datos.sap_opor_id],
            ['BaseLine', datos.base_line],
            ['Almac\u00e9n destino', datos.almacen_destino],
            ['Estanque destino', datos.estanque_destino],
            ['Contenedor', datos.contenedor],
            ['BL', datos.bl],
            ['Booking', datos.booking],
            ['Nave / Naviera', datos.nave_naviera],
            ['CDA', datos.cda],
            ['DI', datos.di],
            ['SUI', datos.sui],
            ['Fecha producci\u00f3n', datos.fecha_produccion],
            ['Fecha vencimiento', datos.fecha_vencimiento],
            ['Cantidad disponible', datos.cantidad_disponible],
            ['Tipo recepci\u00f3n', datos.tipo_origen_recepcion],
            ['Observaci\u00f3n', datos.observacion]
        ];
        const filas = campos.map(function (campo) {
            const valor = campo[1] === null || campo[1] === undefined || campo[1] === ''
                ? 'No disponible en Piso 1' : String(campo[1]);
            return '<div class="col-md-4 mb-2"><strong>' + escapeHtml(campo[0])
                + ':</strong> <span>' + escapeHtml(valor) + '</span></div>';
        }).join('');
        $('#prosesa_piso2_resultado')
            .removeClass('d-none')
            .html('<div class="alert alert-success py-2 mb-2">Datos cargados desde Citaci\u00f3n Piso 1 #'
                + escapeHtml(origenId) + '</div><div class="row">' + filas + '</div>');
    }

    function mensajeErrorPlanificacion(xhr, respaldo) {
        let respuesta = xhr.responseJSON;
        if (!respuesta && xhr.responseText) {
            try { respuesta = JSON.parse(xhr.responseText); } catch (error) { respuesta = null; }
        }
        return respuesta && respuesta.message ? respuesta.message : respaldo;
    }

    function cargarDatosProsesaPiso1() {
        if (!esProsesaPiso2Seleccionado()) return;
        const guia = getValue('guia_origen_prosesa').trim();
        invalidarDatosProsesaPiso2();
        if (!guia) {
            swalFront({ title: 'Atenci\u00f3n', text: 'Ingrese la gu\u00eda de Piso 1.', icon: 'warning' });
            return;
        }
        const boton = $('#btn_cargar_origen_prosesa').prop('disabled', true);
        $.ajax({
            url: '{% url "prosesa_piso_2_cargar_origen" %}',
            type: 'GET',
            dataType: 'json',
            data: { guia: guia },
            success: function (respuesta) {
                if (getValue('guia_origen_prosesa').trim() !== guia) return;
                if (!respuesta.success) {
                    swalFront({ title: 'Error', text: respuesta.message, icon: 'error' });
                    return;
                }
                const datos = respuesta.datos || {};
                origenProsesaPiso2Cargado = {
                    guia: guia,
                    origen_id: respuesta.citacion_piso_1,
                    datos: datos
                };
                seleccionarDatoProsesaPiso2('cliente', datos.cliente, datos.cliente_nombre);
                seleccionarDatoProsesaPiso2('insumo', datos.codigo_sap, datos.insumo, datos.insumo);
                seleccionarDatoProsesaPiso2('pedido', datos.pedido, datos.pedido);
                seleccionarDatoProsesaPiso2(
                    'proveedor',
                    datos.proveedor || datos.codigo_proveedor_sap || datos.proveedor_nombre,
                    datos.proveedor_nombre || datos.proveedor_sap
                );
                [
                    ['codigo', 'codigo_sap'],
                    ['sap_opor_id', 'sap_opor_id'],
                    ['cantidad_disponible', 'cantidad_disponible'],
                    ['docentry', 'docentry'],
                    ['proveedor_codigo', 'proveedor_codigo'],
                    ['codigo_proveedor_sap', 'codigo_proveedor_sap'],
                    ['contenedor', 'contenedor'],
                    ['bl', 'bl'],
                    ['guia', 'guia'],
                    ['fecha_produccion', 'fecha_produccion'],
                    ['fecha_vencimiento', 'fecha_vencimiento'],
                    ['cda', 'cda'],
                    ['di', 'di'],
                    ['sui', 'sui'],
                    ['nave_naviera', 'nave_naviera'],
                    ['booking', 'booking'],
                    ['inf_24hrs', 'inf_24hrs'],
                    ['observacion', 'observacion']
                ].forEach(function (par) { setValue(par[0], datos[par[1]]); });
                $('#tipo_carga').val(datos.tipo_carga || '').trigger('change.select2');
                $('#tipo_origen_recepcion').val(datos.tipo_origen_recepcion || '');
                $('#recepcion_sbh_almacen_destino')
                    .val(datos.almacen_destino || '').trigger('change');
                $('#recepcion_sbh_estanque_destino')
                    .val(datos.estanque_destino || '').trigger('change.select2');
                mostrarSnapshotProsesaPiso2(respuesta.citacion_piso_1, datos);
                actualizarModoProsesa();
            },
            error: function (xhr) {
                const mensaje = mensajeErrorPlanificacion(
                    xhr, 'No fue posible cargar los datos desde Piso 1.'
                );
                $('#prosesa_piso2_resultado').removeClass('d-none')
                    .html('<div class="alert alert-danger py-2">' + escapeHtml(mensaje) + '</div>');
                swalFront({ title: 'Error', text: mensaje, icon: 'error' });
            },
            complete: function () { boton.prop('disabled', false); }
        });
    }

    function normalizarPatenteRetiroProsesa(valor) {
        return String(valor || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    function actualizarModoProsesa() {
        const piso2 = esProsesaPiso2Seleccionado();
        if (!piso2 && origenProsesaPiso2Cargado) invalidarDatosProsesaPiso2();
        $('#prosesa_piso2_busqueda').toggleClass('d-none', !piso2);
        $('#guia_origen_prosesa').prop('required', piso2);
        $('#prosesa_piso2_patente_retiro').prop('required', false);
        $('#prosesa_piso2_empresa_transporte').prop('required', false);

        const controlesHeredados = [
            'cliente', 'inf_24hrs', 'tipo_carga', 'codigo', 'insumo', 'pedido',
            'proveedor', 'tipo_origen_recepcion', 'contenedor', 'bl', 'guia',
            'fecha_produccion', 'fecha_vencimiento', 'cda', 'di', 'sui',
            'nave_naviera', 'booking', 'recepcion_sbh_almacen_destino',
            'recepcion_sbh_estanque_destino', 'estanque_destino', 'observacion'
        ];
        controlesHeredados.forEach(function (id) {
            const control = $('#' + id);
            if (!control.length) return;
            if (piso2 && !control.prop('disabled')) {
                control.attr('data-prosesa-piso2-disabled', '1').prop('disabled', true);
            } else if (!piso2 && control.attr('data-prosesa-piso2-disabled') === '1') {
                control.removeAttr('data-prosesa-piso2-disabled').prop('disabled', false);
            }
        });

        const cantidad = $('#cantidad_repetir');
        if (piso2) cantidad.val(1).prop('readonly', true);
        else cantidad.prop('readonly', false);
    }

    document.addEventListener('DOMContentLoaded', function () {
        opcionesSecuenciaOriginales = $('#secuencia_id option[data-tipo]').clone();
        $('#guia_origen_prosesa').on('input', invalidarDatosProsesaPiso2);
        $('#prosesa_piso2_patente_retiro').on('blur', function () {
            this.value = normalizarPatenteRetiroProsesa(this.value);
        });
        if ($('#prosesa_piso2_empresa_transporte').length) {
            $('#prosesa_piso2_empresa_transporte').select2({
                placeholder: 'Seleccione o escriba empresa de transporte',
                allowClear: true,
                tags: true,
                width: '100%',
                dropdownParent: $('#ModalCrearCitacion'),
                ajax: {
                    url: '{% url "ajax_transportistas_ingreso_camion" %}',
                    dataType: 'json',
                    delay: 250,
                    data: function (params) {
                        return {
                            q: params.term || '',
                            empresa_id: 2,
                            estricto_empresa: '1'
                        };
                    },
                    processResults: function (respuesta) {
                        return { results: respuesta.results || [] };
                    }
                },
                createTag: function (params) {
                    const nombre = String(params.term || '').replace(/\s+/g, ' ').trim();
                    return nombre ? { id: nombre, text: nombre, nuevo: true } : null;
                }
            }).on('select2:select', function (event) {
                const seleccionado = event.params.data || {};
                $('#prosesa_piso2_empresa_transporte_id')
                    .val(seleccionado.socionegocio_id || '');
            }).on('select2:clear', function () {
                $('#prosesa_piso2_empresa_transporte_id').val('');
            });
        }
        if (ES_RECEPCION_SBH) {
            $('#recepcion_sbh_almacen_destino').on('change', poblarEstanquesRecepcionSbh);
            poblarEstanquesRecepcionSbh();
        }
        if (ES_RECEPCION_TRANSFERENCIA_SBH) {
            $('#transferencia_almacen_destino').on('change', poblarEstanquesDestinoTransferencia);
            poblarEstanquesDestinoTransferencia();
        }

        if ($('#cliente').length) {
            $('#cliente').select2({
                placeholder: 'Buscar cliente...',
                allowClear: true,

    function resumenControlDocumental(documentos) {
        const alertas = (documentos || []).filter(function (doc) { return doc.estado !== 'VIGENTE'; });
        if (!alertas.length) return 'Documentación vigente.';
        return alertas.map(function (doc) { return doc.documento + ': ' + doc.estado; }).join(' · ');
    }

    const TEXTO_ALERTA_DOCUMENTAL_NO_BLOQUEANTE = 'Esto es solo una advertencia; no impide que puedas planificar con estos datos.';

    function limpiarControlDocumental(selector) {
        $(selector)
            .removeData('documentalClave')
            .addClass('d-none')
            .removeClass('alert-success alert-warning')
            .addClass('alert-light')
            .empty();
    }

    function prepararControlDocumental(selector, clave) {
        limpiarControlDocumental(selector);
        $(selector).data('documentalClave', clave);
    }

    function mostrarControlDocumental(selector, titulo, documentos) {
        const tieneAlerta = (documentos || []).some(function (doc) { return doc.estado !== 'VIGENTE'; });
        $(selector).removeClass('d-none alert-light alert-success alert-warning')
            .addClass(tieneAlerta ? 'alert-warning' : 'alert-success')
            .html('<strong>' + titulo + '</strong> — ' + resumenControlDocumental(documentos) + '<br><small>' + TEXTO_ALERTA_DOCUMENTAL_NO_BLOQUEANTE + '</small>');
    }

    function registrarAlertaDocumentalPlanificacion(tipo, entidadId) {
        return $.post('{% url "registrar_alerta_documental_terramar" %}', {
            csrfmiddlewaretoken: $('input[name=csrfmiddlewaretoken]').first().val(),
            tipo: tipo, entidad_id: entidadId, modulo: 'PLANIFICACION'
        });
    }

    function evaluarConductorPlanificacion(conductorId, selector) {
        if (!conductorId) {
            limpiarControlDocumental(selector);
            return;
        }
        const clave = 'CONDUCTOR:' + conductorId;
        prepararControlDocumental(selector, clave);
        $.get('/control-flota/conductores/' + conductorId + '/patentes-documentos/').done(function (data) {
            if ($(selector).data('documentalClave') !== clave) return;
            mostrarControlDocumental(selector, 'Licencia de ' + data.conductor.nombre, [data.licencia]);
            if (data.licencia.estado !== 'VIGENTE') registrarAlertaDocumentalPlanificacion('CONDUCTOR', conductorId);
        });
    }

    function evaluarPatentePlanificacion(patente, selector) {
        patente = String(patente || '').trim().toUpperCase();
        if (!patente) {
            limpiarControlDocumental(selector);
            return;
        }
        const clave = 'CAMION:' + patente;
        prepararControlDocumental(selector, clave);
        $.get('{% url "camion_buscar_documentos_terramar" %}', {q: patente}).done(function (data) {
            if ($(selector).data('documentalClave') !== clave) return;
            const camion = (data.results || []).find(function (item) { return String(item.patente || '').trim().toUpperCase() === patente; });
            if (!camion) {
                const patenteSegura = $('<div>').text(patente).html();
                $(selector).removeClass('d-none alert-light alert-success').addClass('alert-warning').html('<strong>Patente ' + patenteSegura + '</strong> no existe en el maestro TERRAMAR.<br><small>' + TEXTO_ALERTA_DOCUMENTAL_NO_BLOQUEANTE + '</small>');
                return;
            }
            $.get('/control-flota/camiones/' + camion.id + '/documentos/').done(function (detalle) {
                if ($(selector).data('documentalClave') !== clave) return;
                mostrarControlDocumental(selector, 'Patente ' + patente, detalle.documentos);
                if ((detalle.documentos || []).some(function (doc) { return doc.estado !== 'VIGENTE'; })) registrarAlertaDocumentalPlanificacion('CAMION', camion.id);
            });
        });
    }

    function eliminarMovimientoTransferencia(id) {

    function limpiarProductoMovimientoTransferencia(fila) {
        fila.find('.transferencia-insumo').empty().append(new Option('Seleccione primero un estanque', '')).prop('disabled', true);
        fila.find('.transferencia-codigo-sap,.transferencia-propiedad,.transferencia-stock,.transferencia-unidad').val('');
        fila.find('.transferencia-sap-estado').removeClass('text-danger').addClass('text-muted').text('');
    }

    function consultarMovimientoTransferencia(fila) {
        const id = fila.data('movimiento-id');
        const estanque = fila.find('.transferencia-estanque-origen').val() || '';
        delete productosTransferenciaPorMovimiento[id];
        limpiarProductoMovimientoTransferencia(fila);
        actualizarTotalTransferencia();
        if (!estanque) return;
        const estado = fila.find('.transferencia-sap-estado').text('Consultando stock SAP...');
        $.get('{% url "api_sap_recepcion_transferencia_estanque" %}', {estanque: estanque}).done(function (data) {
            if (!data || !data.success) {
                estado.removeClass('text-muted').addClass('text-danger').text((data && data.message) || 'No fue posible consultar productos SAP.');
                return;
            }
            const productos = data.productos || [];
            productosTransferenciaPorMovimiento[id] = productos;
            const selector = fila.find('.transferencia-insumo').empty();
            if (!productos.length) {
                selector.append(new Option('Sin productos disponibles', '')).prop('disabled', true);
                estado.text('No hay productos con stock disponible para este estanque.');
                return;
            }
            selector.append(new Option('Seleccione insumo', ''));
            productos.forEach(function (producto) {
                selector.append(new Option(String(producto.codigo_sap || '') + ' - ' + String(producto.insumo || ''), producto.codigo_sap || ''));
            });
            selector.prop('disabled', false);
            if (productos.length === 1) {
                selector.val(productos[0].codigo_sap).trigger('change');
                estado.text('Producto único seleccionado automáticamente.');
            } else {
                estado.text('Seleccione el producto a transferir.');
            }
        }).fail(function (xhr) {
            const data = xhr.responseJSON || {};
            estado.removeClass('text-muted').addClass('text-danger').text(data.message || 'No fue posible consultar productos SAP.');
        });
    }

    function seleccionarProductoMovimientoTransferencia(fila) {
        const id = fila.data('movimiento-id');
        const codigo = fila.find('.transferencia-insumo').val() || '';
        const producto = (productosTransferenciaPorMovimiento[id] || []).find(function (item) {
            return String(item.codigo_sap || '') === String(codigo);
        });
        fila.find('.transferencia-codigo-sap').val(producto ? producto.codigo_sap || '' : '');
        fila.find('.transferencia-propiedad').val(producto ? producto.propiedad_producto || 'Sin propietario informado' : '');
        fila.find('.transferencia-stock').val(producto ? producto.stock_disponible : '');
        fila.find('.transferencia-unidad').val(producto ? producto.unidad || '' : '');
        actualizarTotalTransferencia();
    }

    function actualizarTotalTransferencia() {
        const totales = {};
        $('.transferencia-movimiento').each(function () {
            const fila = $(this);
            const cantidad = Number(String(fila.find('.transferencia-cantidad').val() || '').replace(',', '.'));
            const unidad = fila.find('.transferencia-unidad').val() || 'Sin unidad';
            if (Number.isFinite(cantidad) && cantidad > 0) totales[unidad] = (totales[unidad] || 0) + cantidad;
        });
        const partes = Object.keys(totales).map(function (unidad) {
            return totales[unidad].toLocaleString('es-CL', {maximumFractionDigits: 5}) + ' ' + unidad;
        });
        $('#transferencia_total').text('Total a mover: ' + (partes.length ? partes.join(' / ') : '0'));
    }

        seleccionarProductoMovimientoTransferencia($(this).closest('.transferencia-movimiento'));
    }).on('input', '.transferencia-cantidad', actualizarTotalTransferencia);

    function recopilarMovimientosTransferencia() {
        const movimientos = [];
        const combinaciones = new Set();
        let mensaje = '';
        $('.transferencia-movimiento').each(function (index) {
            const fila = $(this);
            const id = fila.data('movimiento-id');
            const estanque = fila.find('.transferencia-estanque-origen').val() || '';
            const codigo = fila.find('.transferencia-insumo').val() || '';
            const cantidad = Number(String(fila.find('.transferencia-cantidad').val() || '').replace(',', '.'));
            const producto = (productosTransferenciaPorMovimiento[id] || []).find(function (item) { return String(item.codigo_sap || '') === String(codigo); });
            if (!estanque || !producto || !Number.isFinite(cantidad) || cantidad <= 0) {
                mensaje = 'Debe completar estanque, insumo y cantidad a mover en el movimiento ' + (index + 1) + '.';
                return false;
            }
            const stockDisponible = Number(producto.stock_disponible);
            if (Number.isFinite(stockDisponible) && cantidad > stockDisponible) {
                mensaje = 'La cantidad a mover del movimiento ' + (index + 1) + ' supera el stock disponible.';
                return false;
            }
            const clave = estanque + '|' + codigo;
            if (combinaciones.has(clave)) {
                mensaje = 'Este producto ya fue agregado para este estanque.';
                return false;
            }
            combinaciones.add(clave);
            movimientos.push({
                estanque_origen: estanque,
                codigo_sap: codigo,
                cantidad_a_mover: cantidad,
                insumo: producto.insumo || '',
                unidad_inventario_snapshot: producto.unidad || ''
            });
        });
        if (!mensaje && !movimientos.length) mensaje = 'Debe agregar al menos un producto / origen para la transferencia.';
        return {movimientos: movimientos, mensaje: mensaje};
    }

    function agregarRecepcionTransferenciaTemporal() {
        const form = document.getElementById('form_recepcion_transferencia');
        if (!form.checkValidity()) { form.reportValidity(); return; }
        if (!validarTipoPlanificacion('RECEPCION')) return;
        const recopilado = recopilarMovimientosTransferencia();
        if (recopilado.mensaje) {
            swalFront({title: 'Atención', text: recopilado.mensaje, icon: 'warning'});
            return;
        }
        const cantidadCamiones = Number(getValue('transferencia_cantidad_camion'));
        if (!Number.isInteger(cantidadCamiones) || cantidadCamiones < 1) {
            swalFront({title: 'Atención', text: 'La cantidad de camiones debe ser un número entero positivo.', icon: 'warning'});
            return;
        }
        const primerMovimiento = recopilado.movimientos[0];
        const datosBase = {
            flujo: 'TRANSFERENCIA', tipo_operacion: 'RECEPCION', tipo_operacion_texto: 'Recepción de Transferencia',
            fecha_llegada: getValue('transferencia_fecha'), cantidad_camion: 1,
            almacen_destino: getValue('transferencia_almacen_destino'), estanque_destino: getValue('transferencia_estanque_destino'),
            estanque_destino_texto: getSelectedText('transferencia_estanque_destino'), movimientos: recopilado.movimientos,
            estanque_origen: primerMovimiento.estanque_origen, codigo_sap: primerMovimiento.codigo_sap,
            cliente: '', proveedor: '', observacion: ''
        };
        for (let numeroCamion = 1; numeroCamion <= cantidadCamiones; numeroCamion += 1) {
            citacionesTemporales.push({...datosBase, movimientos: recopilado.movimientos.map(function (movimiento) { return {...movimiento}; }), numero_camion: numeroCamion});
        }
        renderizarCitacionesTemporales();
        cerrarModalEtapa0YMostrarResumen('#ModalCrearRecepcionTransferencia');
    }

    function cargarRutasTransportistaRecepcionTerramar() {
        const transportistaId = $('#rt_empresa_transporte_id').val();
        limpiarRutaTransportistaRecepcionTerramar();
        if (!transportistaId || $('#rt_transporte_a_cargo').val() !== 'Terramar') return;

        selector.empty().append(new Option('Cargando rutas...', '')).prop('disabled', true);

            url: '{% url "ajax_rutas_transportista_planificacion" %}', type: 'GET',

            success: function(response) {
                const rutas = response.rutas || [];
                selector.empty().append(new Option(rutas.length ? 'Seleccione ruta' : 'No existen rutas vigentes para este transportista.', ''));
                rutas.forEach(function(ruta) {
                    const texto = ruta.text || '';

                    $(option).attr({'data-ruta-id': ruta.ruta_id || '', 'data-tarifa-id': ruta.tarifa_id || ruta.id, 'data-valor-tarifa': ruta.costo || ''});

    function cargarClientesSapDespachoTerramar() {
        if (!ES_DESPACHO_TERRAMAR) return;
        const selector = $('#despacho_terramar_cliente');
        if (selector.data('catalogo-sap-cargado') || selector.data('catalogo-sap-cargando')) return;
        selector.data('catalogo-sap-cargando', true).prop('disabled', true);
        $.ajax({url: '{% url "api_sap_clientes" %}', type: 'GET', dataType: 'json'})
            .done(function(response) {
                if (!response || !response.ok) {
                    selector.empty().append(new Option('No fue posible cargar clientes SAP', ''));
                    swalFront({title: 'Clientes SAP', text: (response && (response.message || response.mensaje)) || 'No fue posible cargar clientes SAP.', icon: 'error'});
                    return;
                }
                selector.empty().append(new Option('Seleccione cliente', ''));
                (response.clientes || []).forEach(function(cliente) {
                    const option = new Option(cliente.cardname || '', cliente.cardcode || '');
                    $(option).attr('data-cardname', cliente.cardname || '');
                    selector.append(option);
                });
                selector.data('catalogo-sap-cargado', true);
            })
            .fail(function(xhr) {
                const respuesta = xhr.responseJSON || {};
                swalFront({title: 'Clientes SAP', text: respuesta.message || respuesta.mensaje || 'No fue posible cargar clientes SAP.', icon: 'error'});
            })
            .always(function() {
                selector.data('catalogo-sap-cargando', false).prop('disabled', false);
            });
    }

    function cargarRutasDespachoTerramar() {
        const transportistaId = $('#despacho_terramar_empresa_transporte_id').val();
        limpiarRutaDespachoTerramar();
        if (!transportistaId || $('#despacho_terramar_transporte_cargo').val() !== 'Terramar') return;
        const selector = $('#despacho_terramar_ruta_transportista');
        selector.empty().append(new Option('Cargando rutas...', '')).prop('disabled', true);

            url: '{% url "ajax_rutas_transportista_despacho_terramar" %}', type: 'GET', data: {transportista_id: transportistaId},
            success: function(response) {
                const rutas = response.rutas || [];
                selector.empty().append(new Option(rutas.length ? 'Seleccione ruta' : 'No existen rutas vigentes para este transportista.', ''));
                rutas.forEach(function(ruta) {
                    const option = new Option(ruta.text || '', ruta.tarifa_id || ruta.id);
                    $(option).attr({'data-ruta-id': ruta.ruta_id || '', 'data-tarifa-id': ruta.tarifa_id || ruta.id});

    function conductorPendienteDespachoTerramarActivo() {
        return ES_DESPACHO_TERRAMAR

            && $('#despacho_terramar_conductor_pendiente').is(':checked');

    function actualizarConductorPendienteDespachoTerramar() {
        const pendiente = conductorPendienteDespachoTerramarActivo();
        const conductor = $('#despacho_terramar_conductor');
        const campos = $('#despacho_terramar_codigo_pais, #despacho_terramar_celular, #despacho_terramar_patente');

        if (pendiente) {
            conductor.val(null).trigger('change');
            $('#despacho_terramar_conductor_id').val('');
            campos.val('');
            limpiarControlDocumental('#despacho_terramar_control_documental_conductor');
            limpiarControlDocumental('#despacho_terramar_control_documental_camion');
        } else if (!$('#despacho_terramar_codigo_pais').val()) {
            $('#despacho_terramar_codigo_pais').val('+56');
        }

        conductor.prop('disabled', pendiente);
        campos.prop('disabled', pendiente).prop('required', !pendiente);
        campos.closest('.form-group').find('label').toggleClass('required-label', !pendiente);
    }

        const conRelleno = $('#despacho_terramar_relleno').val() === 'SI';

        $('.despacho-terramar-manual').toggleClass('d-none', esTerramar);

    function cargarProductosSap(force = false) {
        const productoSelect = $('#insumo');

        if (!productoSelect.length || (productosSapCargados && !force)) {
            return;
        }

        const valorActual = productoSelect.val() || '';
        productoSelect.prop('disabled', true);
        productoSelect.empty().append(new Option('Cargando productos SAP...', '', false, false));
        productoSelect.trigger('change.select2');

        $.ajax({
            url: '/api/sap/productos/',
            type: 'GET',
            success: function (response) {
                if (!response.ok) {
                    productoSelect.empty().append(new Option('Seleccione producto', '', false, false));
                    swalFront({
                        title: 'Error',
                        text: response.mensaje || response.message || 'No fue posible cargar productos SAP.',
                        icon: 'error'
                    });
                    return;
                }

                productoSelect.empty().append(new Option('Seleccione producto', '', false, false));

                (response.productos || []).forEach(function (producto) {
                    const productoTexto = (producto.itemname || producto.itemcode) + ' - ' + producto.itemcode;
                    const option = new Option(
                        productoTexto,
                        producto.itemcode,
                        false,
                        false
                    );
                    $(option).attr('data-itemname', producto.itemname || '');
                    productoSelect.append(option);
                });

                productosSapCargados = true;

                bloquearLimpiezaProducto = true;
                if (valorActual && productoSelect.find('option[value="' + valorActual.replace(/"/g, '\\"') + '"]').length) {
                    productoSelect.val(valorActual);
                } else {
                    productoSelect.val('');
                }
                productoSelect.trigger('change');
                bloquearLimpiezaProducto = false;
            },
            error: function (xhr) {
                const response = xhr.responseJSON || {};
                productoSelect.empty().append(new Option('Seleccione producto', '', false, false));
                swalFront({
                    title: 'Error',
                    text: response.mensaje || response.message || 'Ocurrió un error al cargar productos SAP.',
                    icon: 'error'
                });
            },
            complete: function () {
                productoSelect.prop('disabled', false);
                productoSelect.trigger('change.select2');
            }
        });
    }

            .prop('disabled', manual || sinCondicion)
            .prop('required', terramar);
        $('#despacho_conductor')
            .prop('disabled', manual || sinCondicion)
            .prop('required', terramar && !ES_DESPACHO_SBH_ETAPA0);
        $('#despacho_empresa_transporte_manual')
            .toggleClass('d-none', !manual)
            .prop('disabled', !manual)
            .prop('required', false);
        $('#despacho_conductor_manual')
            .toggleClass('d-none', !manual)
            .prop('disabled', !manual)
            .prop('required', false);

            .prop('disabled', sinCondicion)
            .prop('required', terramar && !ES_DESPACHO_SBH_ETAPA0);

            .toggleClass('d-none', manual || sinCondicion || !$('#despacho_conductor_mensaje').data('visible-auto'));

    function getValue(id) {
        const element = document.getElementById(id);
        return element ? element.value : '';
    }

    function setValue(id, value) {
        const element = document.getElementById(id);

        if (element) {
            element.value = value || '';
        }
    }

    function getSelectedText(id) {
        const element = document.getElementById(id);

        if (!element) return '';

        if (element.tagName === 'SELECT') {
            if (element.selectedIndex < 0) return '';

            const text = element.options[element.selectedIndex].text.trim();

            if (text.toLowerCase().includes('seleccione')) return '';

            return text;
        }

        return element.value;
    }

    function getSelectedData(id, dataName) {
        const element = document.getElementById(id);

        if (!element || element.tagName !== 'SELECT' || element.selectedIndex < 0) {
            return '';
        }

        const option = element.options[element.selectedIndex];
        return option ? (option.getAttribute('data-' + dataName) || '') : '';
    }

    function escapeHtml(value) {
        if (value === null || value === undefined) return '';

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function formatearFechaTabla(fechaValor) {
        if (!fechaValor) return '';

        const fecha = new Date(fechaValor + 'T00:00:00');

        if (isNaN(fecha.getTime())) {
            return fechaValor;
        }

        const dia = String(fecha.getDate()).padStart(2, '0');
        const mes = String(fecha.getMonth() + 1).padStart(2, '0');
        const ano = fecha.getFullYear();

        return `${dia}/${mes}/${ano}`;
    }

    function filtrarSecuenciasPorTipo() {
        const tipoSeleccionado = $('#tipo').val();
        const selectSecuencia = $('#secuencia_id');

        if (!selectSecuencia.length) return;

        selectSecuencia.empty();
        selectSecuencia.val('');

        if (!tipoSeleccionado) {
            selectSecuencia.append(
                $('<option>', {
                    value: '',
                    text: 'Seleccione tipo de operación primero'
                })
            );

            selectSecuencia.prop('disabled', true);
            selectSecuencia.trigger('change');
            inicializarSelectoresVisualesProsesa();
            return;
        }

        selectSecuencia.prop('disabled', false);

        selectSecuencia.append(
            $('<option>', {
                value: '',
                text: 'Seleccione secuencia operacional'
            })
        );

        let total = 0;

        opcionesSecuenciaOriginales.each(function () {
            const option = $(this);
            const tipoOpcion = String(option.data('tipo') || '').toUpperCase();

            if (tipoOpcion === String(tipoSeleccionado).toUpperCase()) {
                selectSecuencia.append(option.clone());
                total++;
            }
        });

        if (total === 0) {
            selectSecuencia.empty();
            selectSecuencia.append(
                $('<option>', {
                    value: '',
                    text: 'No hay secuencias disponibles'
                })
            );
        }

        selectSecuencia.val('');
        selectSecuencia.trigger('change');
        inicializarSelectoresVisualesProsesa();
    }

    function pedidoTexto(item) {
        const cantidad = item.openqty !== null && item.openqty !== undefined ? item.openqty : item.cantidad_disponible || '';
        return `${item.docnum || item.pedido} - ${item.cardname || item.proveedor_nombre || ''} - ${cantidad}`;
    }

    function lineaPedidoTexto(item) {
        const cantidad = item.openqty !== null && item.openqty !== undefined ? item.openqty : item.cantidad_disponible || '';
        return `${item.descripcion || item.producto || ''} - ${item.itemcode || item.codigo || ''} - ${cantidad} - ${item.cardname || item.proveedor_nombre || ''}`;
    }

    function setPedidoSapOptions(items, seleccion = '') {
        const pedidoSelect = $('#pedido');

        if (!pedidoSelect.length) {
            return;
        }

        bloqueandoCambioPedido = true;
        pedidoSelect.empty().append(new Option('', '', false, false));

        items.forEach(function (item, index) {
            const docnum = String(item.docnum || item.pedido || '');
            const value = `${docnum}__${index}`;
            const option = new Option(pedidoTexto(item), value, false, value === String(seleccion || ''));
            $(option).attr('data-line-index', index);
            $(option).attr('data-docnum', docnum);
            pedidoSelect.append(option);
        });

        if (seleccion && !pedidoSelect.find('option[value="' + String(seleccion).replace(/"/g, '\\"') + '"]').length) {
            pedidoSelect.append(new Option(seleccion, seleccion, true, true));
        }

        pedidoSelect.val(seleccion || '').trigger('change.select2');
        bloqueandoCambioPedido = false;
    }

    function cargarPedidosPorProducto(codigo) {
        pedidosProductoActual = [];
        lineasPedidoActual = [];
        setPedidoSapOptions([]);

        if (!codigo) {
            return;
        }

        $.ajax({
            url: '/api/sap/pedidos-por-producto/',
            type: 'GET',
            data: { codigo: codigo },
            success: function (response) {
                if (!response.ok) {
                    return;
                }

                pedidosProductoActual = response.pedidos || [];
                setPedidoSapOptions(pedidosProductoActual);
            },
            error: function () {
                pedidosProductoActual = [];
                setPedidoSapOptions([]);
            }
        });
    }

    function resolverPedidoSapSeleccionado(pedido) {
        const pedidoLimpio = String(pedido || '').trim();

        if (ES_INGRESO_MERCADERIA_SBH) {
            limpiarProveedorSap();
            setValue('codigo_proveedor_sap', '');
        }
        limpiarDatosPedido(false);

        if (!pedidoLimpio) {
            return;
        }

        if (pedidoLimpio.indexOf('__') > -1) {
            const partes = pedidoLimpio.split('__');
            const index = Number(partes[1]);

            if (!Number.isNaN(index) && pedidosProductoActual[index]) {
                cargarDatosPedidoSap(pedidosProductoActual[index]);
                return;
            }

            if (!Number.isNaN(index) && lineasPedidoActual[index]) {
                cargarDatosPedidoSap(lineasPedidoActual[index]);
                return;
            }
        }

        const codigo = getValue('codigo').trim();
        const pedidoDesdeProducto = pedidosProductoActual.filter(function (item) {
            return String(item.docnum || item.pedido || '') === pedidoLimpio;
        });

        if (codigo && pedidoDesdeProducto.length === 1) {
            cargarDatosPedidoSap(pedidoDesdeProducto[0]);
            return;
        }

        if (codigo && pedidoDesdeProducto.length > 1) {
            lineasPedidoActual = pedidoDesdeProducto;
            mostrarLineasPedidoSap(lineasPedidoActual, pedidoLimpio);
            return;
        }

        consultarDetallePedidoSap(pedidoLimpio);
    }

    function consultarDetallePedidoSap(pedido) {
        setValue('cantidad_disponible', 'Buscando...');

        $.ajax({
            url: '/api/sap/pedido-detalle/',
            type: 'GET',
            data: { pedido: pedido },
            success: function (response) {
                if (!response.ok || !response.lineas || response.lineas.length === 0) {
                    limpiarDatosPedido(false);
                    swalFront({
                        title: 'Sin registros',
                        text: response.mensaje || response.message || 'No existe pedido abierto con saldo disponible.',
                        icon: 'info'
                    });
                    return;
                }

                if (response.lineas.length === 1) {
                    cargarDatosPedidoSap(response.lineas[0]);
                    return;
                }

                lineasPedidoActual = response.lineas;
                mostrarLineasPedidoSap(lineasPedidoActual, pedido);
            },
            error: function (xhr) {
                const response = xhr.responseJSON || {};
                limpiarDatosPedido(false);
                swalFront({
                    title: 'Error',
                    text: response.mensaje || response.message || 'Ocurrió un error al consultar el Pedido SAP.',
                    icon: 'error'
                });
            }
        });
    }

    function mostrarLineasPedidoSap(lineas, pedido) {
        const pedidoSelect = $('#pedido');

        bloqueandoCambioPedido = true;
        pedidoSelect.empty().append(new Option('', '', false, false));

        lineas.forEach(function (item, index) {
            const value = `${item.docnum || pedido}__${index}`;
            const option = new Option(lineaPedidoTexto(item), value, false, false);
            $(option).attr('data-line-index', index);
            pedidoSelect.append(option);
        });

        pedidoSelect.val('').trigger('change.select2');
        pedidoSelect.select2('open');
        bloqueandoCambioPedido = false;

        pedidoSelect.off('select2:select.lineasPedido').on('select2:select.lineasPedido', function (event) {
            const index = Number($(event.params.data.element).attr('data-line-index'));

            if (!Number.isNaN(index) && lineas[index]) {
                cargarDatosPedidoSap(lineas[index]);
                pedidoSelect.off('select2:select.lineasPedido');
            }
        });
    }

    function buscarOporPorPedido() {
        resolverPedidoSapSeleccionado(getValue('pedido'));
    }

    function cargarProductoSap(item) {
        setValue('codigo', item.item_code || getValue('codigo'));
        bloquearLimpiezaProducto = true;
        cargarProductoSapEnSelect(item.item_code || getValue('codigo'), item.item_name || '');
        bloquearLimpiezaProducto = false;

        limpiarProveedorSap();
        limpiarDatosPedido(true);
    }

    function cargarDatosPedidoSap(item) {
        setValue('sap_opor_id', item.docentry || '');
        const docnum = item.docnum || item.pedido || getValue('pedido');
        const pedidoSelect = $('#pedido');

        bloqueandoCambioPedido = true;
        if (pedidoSelect.length && docnum) {
            const option = new Option(String(docnum), String(docnum), true, true);
            pedidoSelect.append(option);
            pedidoSelect.val(String(docnum)).trigger('change.select2');
        } else {
            setValue('pedido', docnum);
        }
        bloqueandoCambioPedido = false;
        setValue(
            'cantidad_disponible',
            item.openqty !== null && item.openqty !== undefined
                ? item.openqty
                : item.cantidad_disponible !== null && item.cantidad_disponible !== undefined
                ? item.cantidad_disponible
                : ''
        );
        setValue('docentry', item.docentry || '');
        setValue('line_num', item.line_num !== undefined && item.line_num !== null ? item.line_num : item.linenum || '');
        const saldoSeleccionado = Number(String(getValue('cantidad_disponible')).trim().replace(',', '.'));
        const sinSaldoSeleccionado = Number.isFinite(saldoSeleccionado) && saldoSeleccionado <= 0;
        $('#saldo_sap_mensaje').toggleClass('d-none', !sinSaldoSeleccionado);
        $('#crear_citacion_temporal').prop('disabled', sinSaldoSeleccionado);
        if (ES_RECEPCION_SBH) {
            setValue('contenedor', item.contenedor || '');
            actualizarBlRecepcionSbh(item.bl);
            setValue('guia', item.guia || '');
            setValue('fecha_produccion', item.fecha_produccion || '');
            setValue('fecha_vencimiento', item.fecha_vencimiento || '');
            setValue('cda', item.cda || '');
            setValue('di', item.di || '');
            setValue('sui', item.sui || '');
            setValue('nave_naviera', item.nave_naviera || '');
            setValue('booking', item.booking || '');
        } else {
            setValue('bl', item.contenedor || item.bl || item.bl_contenedor || '');
        }
        if (ES_INGRESO_MERCADERIA_SBH) {
            limpiarProveedorSap();
        }
        setValue('proveedor_codigo', item.cardcode || item.proveedor_codigo || '');
        setValue('codigo_proveedor_sap', item.codigo_proveedor_sap || item.cardcode || item.proveedor_codigo || '');
        setValue('contrato_sap', item.contrato_sap || '');

        if (item.descripcion) {
            bloquearLimpiezaProducto = true;
            cargarProductoSapEnSelect(item.itemcode || getValue('codigo'), item.descripcion);
            bloquearLimpiezaProducto = false;
        }

        cargarProveedorSapEnSelect(
            item.cardcode || item.proveedor_codigo || '',
            item.cardname || item.proveedor_nombre || '',
            lineasPedidoActual.filter(function (linea) {
                return String(linea.docnum || linea.pedido || '') === String(docnum || '');
            })
        );
    }

    function actualizarBlRecepcionSbh(blSap) {
        if (!ES_RECEPCION_SBH) return;

        const bl = String(blSap || '').trim();
        $('#bl').val(bl).prop('readonly', bl.length > 0);
    }

    function cargarProductoSapEnSelect(codigo, nombre) {
        const productoSelect = $('#insumo');

        if (!productoSelect.length || !codigo) {
            return;
        }

        let existe = false;

        productoSelect.find('option').each(function () {
            if ($(this).val() === codigo) {
                existe = true;
                if (nombre) {
                    $(this).text(nombre);
                    $(this).attr('data-itemname', nombre);
                }
                return false;
            }
        });

        if (!existe) {
            const option = new Option(nombre ? nombre + ' - ' + codigo : codigo, codigo, true, true);
            $(option).attr('data-itemname', nombre || '');
            productoSelect.append(option);
        }

        productoSelect.val(codigo).trigger('change');
    }

    function limpiarProveedorSap() {
        if ($('#proveedor').length) {
            $('#proveedor').empty().append(new Option('Proveedor desde Pedido SAP', '', false, false));
            $('#proveedor').val('').trigger('change');
        }

        setValue('proveedor_codigo', '');
    }

    function cargarProveedorSapEnSelect(codigo, nombre, sugerencias) {
        const proveedorSelect = $('#proveedor');

        if (!proveedorSelect.length || (!codigo && !nombre)) {
            return;
        }

        const candidatos = [{ codigo: codigo || '', nombre: nombre || '' }];
        (sugerencias || []).forEach(function (item) {
            candidatos.push({
                codigo: item.cardcode || item.proveedor_codigo || '',
                nombre: item.cardname || item.proveedor_nombre || ''
            });
        });

        const vistos = new Set();
        candidatos.forEach(function (candidato) {
            const valor = candidato.codigo || candidato.nombre;
            if (!valor || vistos.has(valor)) return;
            vistos.add(valor);
            const option = new Option(candidato.nombre || candidato.codigo, valor, false, false);
            $(option).attr('data-cardname', candidato.nombre || '');
            $(option).attr('data-cardcode', candidato.codigo || '');
            proveedorSelect.append(option);
        });

        proveedorSelect.val(codigo || nombre).trigger('change');
    }

    function setDespachoSelectOption(selector, value, text) {
        const select = $(selector);

        if (!select.length || !value) {
            return;
        }

        if (selector === '#despacho_formato' && !FORMATOS_DESPACHO_PERMITIDOS.includes(String(value))) {
            select.val('').trigger('change');
            return;
        }

        let existe = false;
        select.find('option').each(function () {
            if ($(this).val() === String(value)) {
                existe = true;
                if (text) {
                    $(this).text(text);
                }
                return false;
            }
        });

        if (!existe) {
            select.append(new Option(text || value, value, true, true));
        }

        select.val(value).trigger('change');
    }

    function numeroSapDespacho(value) {
        if (value === null || value === undefined || value === '') {
            return '';
        }

        return String(value);
    }

    function normalizarDecimalDespacho(value) {
        let texto = String(value || '').trim();

        if (!texto) {
            return null;
        }

        if (texto.indexOf(',') > -1) {
            texto = texto.replace(/\./g, '').replace(',', '.');
        }

        const numero = Number(texto);
        return Number.isNaN(numero) ? null : numero;
    }

    function saldoContratoSapDespacho(item) {
        const saldoSap = normalizarDecimalDespacho(item.saldo_contrato_sap);

        if (saldoSap !== null) {
            return saldoSap;
        }

        const planificada = normalizarDecimalDespacho(item.cantidad_planificada);
        const consumida = normalizarDecimalDespacho(item.cantidad_consumida);

        if (planificada === null || consumida === null) {
            return null;
        }

        return planificada - consumida;
    }

    function renderResultadoSapDespacho(resultado) {
        if (!resultado.id) return resultado.text;
        const item = resultado.sap || {};
        const opcion = $('<span class="sap-acuerdo-resultado"></span>').text(resultado.text || '');
        if (ES_DESPACHO_SBH_ETAPA0 && item.selectable === false) {
            opcion
                .addClass('sap-acuerdo-resultado--bloqueado')
                .attr(
                    'title',
                    item.selection_block_reason
                        || 'Este acuerdo no posee una OC asociada y no puede utilizarse para planificar.'
                );
        }
        return opcion;
    }

    function configuracionSelectSapDespacho() {
        return {
            placeholder: 'Buscar acuerdo SAP QA...',
            allowClear: true,
            width: '100%',
            dropdownParent: $('#ModalCrearDespacho'),
            templateResult: renderResultadoSapDespacho,
            minimumInputLength: 2,
            ajax: {
                url: '/api/sap/despacho-acuerdos/',
                dataType: 'json',
                delay: 250,
                data: function (params) {
                    return { q: params.term || '', _empresa_id: getValue('empresa_id') };
                },
                processResults: function (response) {
                    if (!response.ok) return { results: [] };
                    return {
                        results: (response.resultados || []).map(function (item, index) {
                            const texto = [
                                item.sap_acuerdo_numero || '',
                                item.oc_cliente || 'Sin OC',
                                item.cliente_nombre || '',
                                item.nombre_insumo || item.codigo_insumo || '',
                                item.saldo_contrato_sap !== null && item.saldo_contrato_sap !== undefined
                                    ? 'Saldo contrato: ' + item.saldo_contrato_sap
                                    : ''
                            ].filter(Boolean).join(' | ');
                            return {
                                id: String(item.sap_abs_id || '') + '__' + String(item.linea_acuerdo || index),
                                text: texto,
                                sap: item,
                                disabled: ES_DESPACHO_SBH_ETAPA0 && item.selectable === false
                            };
                        })
                    };
                }
            },
            language: {
                inputTooShort: function () { return 'Ingrese al menos 2 caracteres'; },
                noResults: function () { return 'No se encontraron acuerdos SAP. Puede ingresar el despacho manualmente.'; },
                searching: function () { return 'Buscando acuerdos SAP...'; }
            }
        };
    }

    function obtenerAsignacionSapPorId(asignacionId) {
        return asignacionesSapPlanificadas.find(function (asignacion) {
            return asignacion.ui_id === Number(asignacionId);
        }) || null;
    }

    function obtenerVistaPreviaSapPorId(asignacionId) {
        return vistasPreviasSapDespacho[Number(asignacionId)] || null;
    }

    function normalizarOrdenAsignacionesSap() {
        asignacionesSapPlanificadas.sort(function (a, b) { return a.ui_id - b.ui_id; });
        asignacionesSapPlanificadas.forEach(function (asignacion, index) {
            asignacion.orden = index + 1;
        });
    }

    function inicializarBuscadorAsignacionSap(select) {
        select.select2(configuracionSelectSapDespacho());
        select.off('.asignacionSap');
        select.on('select2:select.asignacionSap', function (event) {
            seleccionarAsignacionSap(Number($(this).data('asignacion-id')), (event.params.data || {}).sap || {});
        });
        select.on('select2:clear.asignacionSap', function () {
            const asignacionId = Number($(this).data('asignacion-id'));
            delete vistasPreviasSapDespacho[asignacionId];
            actualizarDetalleVisualAsignacionSap(asignacionId);
            evaluarAdvertenciaSaldoDespacho();
        });
    }

    function crearBloqueAsignacionSap(asignacionId) {
        const bloque = $(
            '<div class="despacho-asignacion-sap" data-asignacion-id="' + asignacionId + '">' +
                '<div class="despacho-asignacion-sap-header"><strong>Contrato SAP ' + asignacionId + '</strong>' +
                    '<div><span class="badge badge-success d-none js-sap-confirmado">Contrato confirmado</span>' +
                    '<button type="button" class="btn btn-outline-danger btn-sm ml-2" onclick="eliminarAsignacionSap(' + asignacionId + ')">Eliminar</button></div>' +
                '</div>' +
                '<div class="form-group mb-0"><label>Buscar acuerdo SAP QA</label>' +
                    '<select class="form-control js-despacho-sap-busqueda" data-asignacion-id="' + asignacionId + '"></select>' +
                '</div>' +
                '<div class="despacho-asignacion-sap-detalle d-none">' +
                    '<div class="row">' +
                        '<div class="col-lg-4 col-md-6"><small class="text-muted">Acuerdo SAP</small><strong class="d-block js-sap-acuerdo"></strong></div>' +

                        '<div class="col-lg-4 col-md-6"><small class="text-muted">Producto SAP</small><strong class="d-block js-sap-producto"></strong></div>' +
                        '<div class="col-lg-4 col-md-6 mt-3"><small class="text-muted">OC Cliente</small><strong class="d-block js-sap-oc"></strong></div>' +
                        '<div class="col-lg-4 col-md-6 mt-3"><small class="text-muted">Cantidad contrato</small><strong class="d-block js-sap-planificada"></strong></div>' +

                        '<div class="col-12 mt-3"><small class="text-muted">Estanque(s) con stock</small><div class="js-sap-stock-warehouses">Seleccione un acuerdo SAP.</div></div>' +
