<div class="modal fade" id="ModalCrearRecepcionTerramar" tabindex="-1" role="dialog"><div class="modal-dialog modal-dialog-scrollable modal-xl" role="document"><div class="modal-content">
<div class="modal-header"><div><h5 class="modal-title">Crear recepción – Etapa 0</h5><small class="modal-subtitle">Datos operacionales de recepción Terramar.</small></div><button type="button" class="close" data-dismiss="modal"><span>&times;</span></button></div>
<form id="form_recepcion_terramar"><div class="modal-body"><div class="row">
<div class="col-lg-4 col-md-6"><div class="form-group"><label class="required-label">Fecha llegada</label><input class="form-control" type="date" id="rt_fecha_llegada" value="{{ fecha_planificacion_existente|default:'' }}" required></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label>Contenedor / CRT</label><input class="form-control" id="rt_contenedor_crt"></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label class="required-label">Insumo</label><select class="form-control" id="rt_insumo" required><option value="">Seleccione insumo</option>{% for insumo in insumos_recepcion_terramar %}<option value="{{ insumo.id }}" data-codigo="{{ insumo.IT_CCODIGO }}" data-nombre="{{ insumo.IT_CNOMBRE }}">{{ insumo.IT_CCODIGO }} — {{ insumo.IT_CNOMBRE }}</option>{% endfor %}</select></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label class="required-label">Bodega</label><input class="form-control" id="rt_bodega" required></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label class="required-label">N° guía despacho</label><input class="form-control" id="rt_numero_guia" required></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label class="required-label">Transporte a cargo de</label><select class="form-control" id="rt_transporte_a_cargo" required><option value="">Seleccione</option><option value="Terramar">Terramar</option><option value="Cliente">Cliente</option></select></div></div>
<div class="col-lg-4 col-md-6 rt-maestro"><div class="form-group"><label id="rt_empresa_label">Empresa transporte</label><select class="form-control" id="rt_empresa_transporte"></select><input type="hidden" id="rt_empresa_transporte_id"></div></div><div class="col-lg-4 col-md-6 rt-maestro" id="rt_ruta_transportista_contenedor"><div class="form-group"><label id="rt_ruta_label">Ruta del transportista</label><select class="form-control" id="rt_ruta_transportista" disabled><option value="">Seleccione primero empresa transporte</option></select><input type="hidden" id="rt_ruta_id"><input type="hidden" id="rt_tarifa_id"><small class="text-muted" id="rt_ruta_ayuda"></small></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label id="rt_conductor_label">Conductor</label><select class="form-control rt-maestro" id="rt_conductor"></select><input class="form-control d-none rt-manual" id="rt_conductor_manual" placeholder="Conductor"><input type="hidden" id="rt_conductor_id"></div></div>
<div class="col-lg-4 col-md-6 rt-manual-group d-none"><div class="form-group"><label id="rt_rut_conductor_label" class="required-label">RUT conductor</label><input class="form-control" id="rt_rut_conductor" maxlength="32" autocomplete="off" placeholder="12.345.678-5"></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label id="rt_codigo_pais_label">Código país</label><select class="form-control" id="rt_codigo_pais"><option value="">Seleccione</option>{% for pais in paises_telefono %}<option value="{{ pais.codigo_telefonico }}" {% if pais.codigo_telefonico == '+56' %}selected{% endif %}>{{ pais.nombre }} ({{ pais.codigo_telefonico }})</option>{% endfor %}</select></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label id="rt_telefono_label">Celular conductor</label><input class="form-control" id="rt_telefono" inputmode="tel"></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label id="rt_patente_label">Patente camión</label><input class="form-control text-uppercase" id="rt_patente"></div></div>
<div class="col-12"><div id="rt_control_documental_conductor" class="alert alert-light py-2 d-none" aria-live="polite"></div></div>
<div class="col-12"><div id="rt_control_documental_camion" class="alert alert-light py-2 d-none" aria-live="polite"></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label class="required-label">Hora citación</label><input class="form-control" type="time" id="rt_hora_citacion" required></div></div>
<div class="col-lg-4 col-md-6"><div class="form-group"><label class="required-label">Flujo operacional</label><select class="form-control" id="rt_secuencia" required><option value="">Seleccione flujo</option>{% for secuencia in secuencias_recepcion_terramar %}<option value="{{ secuencia.id }}">{{ secuencia.SE_CNOMBRE }}</option>{% endfor %}</select></div></div>
</div></div><div class="modal-footer modal-footer-custom"><button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button><button type="button" class="btn btn-success" onclick="agregarRecepcionTerramarTemporal()">Crear</button></div></form>
</div></div></div>
