<div class="modal fade" id="ModalCrearRecepcionTransferencia" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title">Crear recepción – Etapa 0</h5>
                    <small class="modal-subtitle">Tipo de Planificación: <strong>Recepción de Transferencia</strong></small>
                </div>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
            </div>
            <form id="form_recepcion_transferencia">
                <div class="modal-body">
                    <div class="form-section-title">Recepción de Transferencia</div>
                    <div class="form-row">
                        <div class="form-group col-md-6"><label class="required-label">Fecha</label><input class="form-control" type="date" id="transferencia_fecha" value="{{ fecha_planificacion_existente|default:'' }}" required></div>
                        <div class="form-group col-md-6"><label class="required-label">Cantidad de camiones</label><input class="form-control" type="number" min="1" step="1" id="transferencia_cantidad_camion" required></div>
                        <div class="form-group col-md-6"><label class="required-label">Almacén destino</label><select class="form-control" id="transferencia_almacen_destino" required><option value="">Seleccione almacén</option>{% for clave, etiqueta in almacenes_recepcion_operacional %}<option value="{{ clave }}">{{ etiqueta }}</option>{% endfor %}</select></div>
                        <div class="form-group col-md-6"><label class="required-label">Estanque destino</label><select class="form-control" id="transferencia_estanque_destino" required disabled><option value="">Seleccione primero un almacén</option></select></div>
                    </div>
                    <div class="form-section-title d-flex justify-content-between align-items-center">
                        <span>Productos / movimientos a transferir</span>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="agregarMovimientoTransferencia()"><i class="fas fa-plus mr-1"></i>Agregar producto / origen</button>
                    </div>
                    <div id="transferencia_movimientos"></div>
                    <div id="transferencia_total" class="alert alert-light border mb-0">Total a mover: 0</div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button><button type="button" class="btn btn-success" onclick="agregarRecepcionTransferenciaTemporal()">Crear</button></div>
            </form>
        </div>
    </div>
</div>
